<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Texans Vertical Feed</title>
<style>
/* The brand's display face: HelveticaNeueLT Extended, the two cuts the feed uses, served from
   this origin. Body copy stays on the system Helvetica stack, as the brand does. */
@font-face{font-family:"HelveticaNeueLT Ex";font-weight:900;font-style:normal;font-display:swap;
 src:url(/app/assets/fonts/HelveticaNeueLTStd-BlkEx.otf) format("opentype")}
@font-face{font-family:"HelveticaNeueLT Ex";font-weight:500;font-style:normal;font-display:swap;
 src:url(/app/assets/fonts/HelveticaNeueLTStd-MdEx.otf) format("opentype")}
:root{--steel:#021118;--s2:#0a1d27;--s3:#13303d;--red:#eb0028;--red2:#ff123a;--blue:#0080c6;
 --w:#fff;--body:rgba(255,255,255,.84);--mute:rgba(255,255,255,.55);--line:rgba(255,255,255,.16);
 --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
 --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);
 --display:"HelveticaNeueLT Ex","Helvetica Neue",Helvetica,Arial,sans-serif;
 --plate:url(/app/assets/steel-916.jpg)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--steel);color:var(--w);font:15px/1.5 var(--sans);overflow:hidden}
.wrap{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:1180px;margin:0 auto;
 position:relative}

.bar{display:flex;gap:7px;padding:12px 16px 10px;overflow-x:auto;scrollbar-width:none;
 padding-top:calc(12px + env(safe-area-inset-top,0px))}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--line);color:var(--body);
 font:900 10px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;
 min-height:40px;cursor:pointer;transition:all .14s var(--ease)}
.chip:hover{border-color:var(--red);color:var(--w)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.stage{position:relative;min-height:0;min-width:0;display:flex;justify-content:center;
 padding:0 16px 16px}
.phone{position:relative;aspect-ratio:9/16;height:100%;width:auto;max-width:100%;min-width:0;
 flex:0 1 auto;background:#000;border:1px solid var(--line);overflow:hidden}
@supports not (aspect-ratio:9/16){.phone{width:min(100%,56.25vh)}}
.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;
 scrollbar-width:none;-webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.slide>img,.slide>video,.slide>iframe{position:absolute;inset:0;width:100%;height:100%;
 object-fit:cover;border:0;display:block}
.slide>video{background:transparent}
.gen{position:absolute;inset:0}
.st,.sb{position:absolute;left:0;right:0;pointer-events:none}
.st{top:0;height:32%;background:linear-gradient(180deg,rgba(2,17,24,.8),transparent)}
.sb{bottom:0;height:54%;background:linear-gradient(0deg,rgba(2,17,24,.95) 8%,rgba(2,17,24,.5) 46%,transparent)}
.sb.rail{height:30%;background:linear-gradient(0deg,rgba(2,17,24,.88) 4%,rgba(2,17,24,.34) 54%,transparent)}
.segs{position:absolute;top:9px;left:9px;right:9px;display:flex;gap:3px;z-index:6;
 pointer-events:none}
.pos{position:absolute;top:19px;right:11px;z-index:6;margin:0;font-size:9.5px;
 letter-spacing:.12em;color:rgba(255,255,255,.75);text-shadow:0 1px 4px rgba(0,0,0,.9);
 pointer-events:none}
.segs i{flex:1;height:2px;background:rgba(255,255,255,.26)}
.segs i.on{background:#fff}
.segs i.cur{background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.segs i.cur .fill{position:absolute;inset:0 auto 0 0;width:0;background:#fff;display:block}
.top{position:absolute;top:34px;left:11px;right:11px;z-index:3;display:flex;gap:7px;align-items:center}
.coll{font:900 9px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;background:var(--red);
 padding:4px 7px}
.coll.sp{background:var(--blue)}
.dur{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.75)}
.bot{position:absolute;left:11px;right:56px;bottom:calc(13px + env(safe-area-inset-bottom,0px));z-index:3}
.bot h2{font:900 21px/.9 var(--display);text-transform:uppercase;letter-spacing:-.01em;margin:0 0 7px;
 text-wrap:balance}
.bot p{font-size:12.5px;line-height:1.45;color:var(--body);margin:0 0 10px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cta{display:inline-flex;align-items:center;background:var(--red);color:#fff;border:0;
 font:900 10px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:10px 13px;
 cursor:pointer;text-decoration:none;transition:background .14s var(--ease)}
.cta:hover{background:var(--red2)}
.cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
.flash{position:absolute;left:11px;right:56px;bottom:calc(60px + env(safe-area-inset-bottom,0px));
 z-index:5;margin:0;font-family:var(--mono);font-size:11px;background:rgba(2,17,24,.92);
 border:1px solid var(--line);padding:7px 10px;word-break:break-all}
.rail{position:absolute;right:7px;bottom:calc(15px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;
 gap:13px;align-items:center}
.rb{background:none;border:0;padding:4px 2px;cursor:pointer;color:#fff;display:flex;
 flex-direction:column;align-items:center;justify-content:center;gap:3px;
 /* 24x37 cleared WCAG 2.5.8 by nothing and missed the 44pt practical minimum. */
 min-width:44px;min-height:44px}
.rb svg{width:24px;height:24px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.85))}
.rb span{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;
 text-shadow:0 1px 3px rgba(0,0,0,.9)}
.rb[aria-pressed="true"] svg{color:var(--red)}
.rb:focus-visible{outline:2px solid var(--red);outline-offset:3px}
/* ---- overlays: text and link blocks layered on the card ---- */
.ovl{position:absolute;inset:0;z-index:2;pointer-events:none}
.ov{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;max-width:86%;
 font-weight:900;text-transform:uppercase;line-height:.96;letter-spacing:-.01em;
 text-wrap:balance;margin:0;text-decoration:none;display:block}
.ov.band{left:0!important;transform:translateY(-50%);width:100%;max-width:100%;padding:10px 14px}
.ov.box{padding:9px 13px}
.ov.sm{font-size:clamp(11px,3.4cqw,15px)}
.ov.md{font-size:clamp(14px,4.8cqw,21px)}
.ov.lg{font-size:clamp(19px,7cqw,31px)}
.ov.xl{font-size:clamp(25px,10cqw,45px)}
.ov.c-white{color:#fff;text-shadow:0 2px 12px rgba(2,17,24,.75)}
.ov.c-red{color:var(--red);text-shadow:0 2px 12px rgba(2,17,24,.75)}
.ov.c-steel{color:var(--steel);text-shadow:none}
.ov.c-blue{color:var(--blue);text-shadow:0 2px 12px rgba(2,17,24,.75)}
.ov.band.c-white,.ov.box.c-white{background:#fff;color:var(--steel);text-shadow:none}
.ov.band.c-red,.ov.box.c-red{background:var(--red);color:#fff;text-shadow:none}
.ov.band.c-steel,.ov.box.c-steel{background:var(--steel);color:#fff;text-shadow:none}
.ov.band.c-blue,.ov.box.c-blue{background:var(--blue);color:#fff;text-shadow:none}
a.ov{transition:transform .14s var(--ease)}
a.ov:hover{transform:translate(-50%,-50%) scale(1.02)}
a.ov.band:hover{transform:translateY(-50%) scale(1.01)}
a.ov:focus-visible{outline:2px solid #fff;outline-offset:3px}
.slide{container-type:inline-size}
.slide>img.contain,.slide>video.contain{object-fit:contain;background:#000}
.nav{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:6;display:flex;
 flex-direction:column;gap:6px;opacity:0;transition:opacity .16s var(--ease)}
.phone:hover .nav,.nav:focus-within{opacity:1}
.nav button{background:rgba(2,17,24,.72);border:1px solid var(--line);color:#fff;width:30px;
 height:30px;padding:0;font-size:13px;cursor:pointer;line-height:1}
.nav button:hover{background:var(--red);border-color:var(--red)}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(hover:none){.nav{display:none}}
/* A wide-but-short module is a plausible placement, and there the arrows landed directly
   on the Like button. The scroll and the keyboard both still work without them. */
@media(max-height:520px){.nav{display:none}}
.msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
 color:var(--mute);font-size:14px;text-align:center;padding:24px;gap:4px;line-height:1.6}
.msg b{color:var(--w);font-size:15px}
.msg .retry{margin-top:12px;background:var(--red);border:0;color:#fff;padding:11px 20px;
 min-height:44px;font:700 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
 cursor:pointer}
.msg .retry:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.feed{scroll-behavior:auto}}

/* ---- responsive overrides live last so they win over the base rules ---- */
/* On a phone this is the whole screen, not a preview of one — the gutters and the border
   were showing letterboxing on the exact device it gets embedded in. */
@media(max-width:600px){
  .stage{padding:0}
  .phone{border:0;aspect-ratio:auto;height:100%;width:100%}
  .wrap{grid-template-rows:1fr}
  /* Stacked in a fixed order down the top of the card: progress, then filters, then the
     card's own meta. Overlaying them all at the top collided. */
  .segs{top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px}
  .bar{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:0;right:0;z-index:7;
    padding:8px 12px 6px;background:linear-gradient(180deg,rgba(2,17,24,.8),transparent)}
  .pos{top:calc(9px + env(safe-area-inset-top,0px));right:10px}
  .top{top:calc(74px + env(safe-area-inset-top,0px))}
  .nav{display:none}
}
/* Tap to play. A YouTube card is a poster until tapped; then YouTube's own player takes the
   frame, unobscured, with our bar above it. That is what its terms require, and it is the
   difference between a slideshow and a feed that plays. */
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:72px;height:72px;
 border:0;background:rgba(2,17,24,.72);color:#fff;display:flex;align-items:center;justify-content:center;
 cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.play svg{width:30px;height:30px;margin-left:3px}
.play:focus-visible{outline:2px solid #fff;outline-offset:3px}
.slide>img[data-play]{cursor:pointer}
/* In-feed playback. The active YouTube card mounts YouTube's player in the area between the
   progress strip and a slim band of ours at the bottom. Nothing of ours sits over the video;
   the band carries the headline and the controls. The poster stays underneath until the
   player reports it is playing, so there is never a black frame. The height is explicit:
   an iframe is a replaced element, and with top and bottom set and height auto it kept
   its 150px default rather than stretching. */
.slide.yt>iframe.yt{position:absolute;left:0;right:0;top:26px;bottom:60px;width:100%;height:calc(100% - 86px);border:0;
 background:#000;opacity:0;transition:opacity .3s var(--ease);z-index:2}
.slide.yt.yt-playing>iframe.yt{opacity:1}
.slide.yt.yt-playing>.play,.slide.yt.yt-playing>.top{display:none}
.slide.yt>.sb,.slide.yt>.bot,.slide.yt>.rail{display:none}
.slide.yt>.band{position:absolute;left:0;right:0;bottom:0;height:60px;z-index:6;display:flex;align-items:center;
 gap:2px;padding:0 4px 0 12px;background:var(--steel,#021118);border-top:1px solid rgba(255,255,255,.12)}
.band b{flex:1;min-width:0;font:900 11px/1.2 var(--display);text-transform:uppercase;letter-spacing:.02em;color:#fff;
 overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:6px}
.band .rb{flex:none;min-width:40px;min-height:44px;padding:4px}
.band .rb span{display:none}
.band .rb svg{width:20px;height:20px}
#player{position:fixed;inset:0;z-index:40;background:#021118;display:flex;flex-direction:column}
#player[hidden]{display:none}
#player .pbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px 12px;
 color:#fff;border-bottom:1px solid rgba(255,255,255,.14);min-height:48px}
#player .pbar b{flex:1;font-weight:500;font-size:12px;line-height:1.25;letter-spacing:.02em;text-transform:uppercase;
 overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#player .pclose{flex:none;width:44px;height:44px;border:0;background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#player .pclose svg{width:22px;height:22px}
#player .pclose:focus-visible{outline:2px solid #fff;outline-offset:-4px}
#player .pframe{flex:1;min-height:0;background:#000}
#player .pframe iframe{display:block;width:100%;height:100%;border:0}
/* Reason pills: why this card is here, in the fan's words. */
.why{display:block;font:600 10px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#4fb3ff;margin-bottom:3px}
.bot .why{margin-bottom:6px}
/* The pick chip: one tap on the card after a completed clip. Sits above the band, never over a control. */
.pickchip{position:absolute;left:50%;bottom:calc(124px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:6;
  background:var(--red);color:#fff;border:0;padding:12px 18px;font:900 13px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;
  cursor:pointer;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.pickchip.in{opacity:1;transform:translate(-50%,0)}
.pickchip.done{background:#fff;color:#021018}
.pickchip:disabled{cursor:default}
.chip.mine{border-color:#0080C6;color:#fff}
/* System cards: the picker and data capture. */
/* System cards sit on the brand's steel flag plate (fabric weave, red speckle, the star), never
   on a flat field or a decorative gradient. The mono stamp with the boxed Texans star is the
   brand's technical caption; the 3px red rule is its card accent; chrome is square. */
.slide.sys{background:#021018 var(--plate) center/cover no-repeat}
.slide.sys>.st{display:none}
.stamp{display:flex;align-items:center;gap:8px;font:500 10px/1.5 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.7)}
.stamp i{flex:none;width:18px;height:18px;border:1px solid rgba(255,255,255,.6);display:inline-flex;align-items:center;justify-content:center}
.stamp i::before{content:"";width:10px;height:10px;background:currentColor;
  -webkit-mask:url(/app/assets/texans-star.png) center/contain no-repeat;mask:url(/app/assets/texans-star.png) center/contain no-repeat}
.pk{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:12px;overflow:auto;color:#fff;
  padding:calc(72px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.pk .stamp{border-top:3px solid var(--red);padding-top:10px}
.pk h2{font:900 24px/.9 var(--display);text-transform:uppercase;letter-spacing:-.01em;margin:0;text-wrap:balance}
.pk p{margin:0;font-size:13px;line-height:1.45;color:rgba(255,255,255,.82)}
.pk h3{font:500 10px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.18em;color:rgba(255,255,255,.62);margin:6px 0 0}
.pk .stat{display:block;font:900 64px/.86 var(--display);letter-spacing:-.02em;color:#ff0000;margin:4px 0 0}
.pk .opts{display:flex;flex-wrap:wrap;gap:8px}
.pk .opt{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#fff;border-radius:4px;padding:10px 13px;
  font:900 10px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:40px;transition:all .14s var(--ease)}
.pk .opt:hover{border-color:var(--red)}
.pk .opt[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.pk .acts{margin-top:auto;display:flex;gap:10px;align-items:center;padding-top:8px}
.pk .save{flex:1;background:var(--red);color:#fff;border:0;border-radius:0;padding:15px 14px;font:900 12px/1 var(--display);
  text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:background .14s var(--ease)}
.pk .save:hover{background:var(--red2)}
.pk .save:active{transform:translateY(1px)}
.pk .save:disabled{opacity:.4}
.pk .skip{background:none;border:1px solid var(--line);color:#fff;font:900 10px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;
  padding:14px 12px;cursor:pointer}
.pk .note{font:500 9px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.pk .offer{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:0;padding:10px 12px;display:flex;gap:10px;align-items:center}
.pk .moretoggle{align-self:flex-start;background:none;border:0;border-bottom:1px solid var(--line);color:rgba(255,255,255,.75);
  font:500 10px/1.5 var(--mono);letter-spacing:.18em;text-transform:uppercase;padding:6px 0;cursor:pointer}
.pk .moretoggle:hover{color:#fff;border-color:var(--red)}
.pk .more{display:flex;flex-direction:column;gap:12px}
.pk .more[hidden]{display:none}
.pk.quick .acts{margin-top:12px}
.pk .peek{display:flex;gap:8px}
.pk .peek img{flex:1;min-width:0;aspect-ratio:9/16;object-fit:cover;border:1px solid var(--line);background:#000;display:block}
.pk .offer b{flex:1;font-size:13px;line-height:1.3}
.toast{position:fixed;left:16px;right:16px;top:calc(72px + env(safe-area-inset-top,0px));z-index:30;background:#0080C6;color:#fff;
  padding:12px 14px;border-radius:4px;font:700 13px/1.3 var(--sans);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
.toast .tact{display:block;margin:10px auto 0;background:#fff;color:var(--steel);border:0;padding:10px 14px;
  font:900 10px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:40px}
/* ---- the rail layout: a row of tiles the width of the slot, for the roster and player pages.
   A tile opens the feed itself, full-frame, at that card. The feed stays one DOM: the same
   cards, the same observer, the same events; it is only hidden until a tile is tapped. */
.tiles{display:none}
.rail-mode .wrap{max-width:none;grid-template-rows:auto 1fr}
.rail-mode .tiles{display:flex;gap:10px;min-height:0;overflow-x:auto;overflow-y:hidden;padding:0 16px 16px;
  scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail-mode .tiles::-webkit-scrollbar{display:none}
.tile{flex:none;height:100%;aspect-ratio:9/16;position:relative;border:1px solid var(--line);padding:0;background:#000;
  color:#fff;cursor:pointer;overflow:hidden;text-align:left;scroll-snap-align:start;font:inherit}
/* A photo tile is a picture with a solid band under it. Our type never sits on the picture:
   Shorts thumbnails carry their own burned-in text and score bugs, and two layers of type on
   236 pixels is unreadable. The band holds the headline and, once per run, the reason. */
.tile{display:flex;flex-direction:column}
.tile .art{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
.tile .art>img,.tile .art>.gen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .art>img{z-index:1}
.tile .art>.tprev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none;border:0;background:transparent;opacity:0;transition:opacity .4s}
.tile .art>.tprev.on{opacity:1;z-index:2}
.tile .tb{flex:none;background:var(--steel);border-top:2px solid var(--red);padding:10px 10px 11px;min-height:80px;display:flex;
  flex-direction:column;justify-content:flex-start;gap:4px}
/* Readability pass, 3 Nov: Adam read the strip on a phone and the type was too small. The headline
   goes up a step with more leading, the reason line a step with more contrast, and the band gets
   the brand's red rule so it reads as a caption, not a gap. */
.tile .tb h3{font:900 13.5px/1.1 var(--display);text-transform:uppercase;letter-spacing:0;margin:0;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tb .why{display:block;font:500 9.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#7cc8ff;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tb p{margin:0;font-size:11px;line-height:1.35;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.tile .tcoll{position:absolute;top:8px;left:8px;z-index:3;font:900 9px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;
  background:var(--red);color:#fff;padding:5px 7px}
.tile .tdur{position:absolute;right:8px;bottom:8px;z-index:3;display:inline-flex;align-items:center;gap:5px;background:rgba(2,16,24,.9);
  color:#fff;font:500 10px/1 var(--mono);letter-spacing:.06em;padding:5px 7px}
.tile .tdur svg{width:10px;height:10px;fill:#fff}
.tile.sys{background:#021018 var(--plate) center/cover no-repeat;border-color:var(--line);justify-content:flex-end;position:relative}
.tile.sys .tsb{position:absolute;inset:0;background:linear-gradient(0deg,rgba(2,17,24,.85) 0%,rgba(2,17,24,.35) 45%,transparent 70%)}

</style></head><body>
<div class="wrap">
  <div class="bar" id="bar" role="group" aria-label="Collections"></div>
  <div class="tiles" id="tiles" role="group" aria-label="Clips"></div>
  <div class="stage" id="stage"><button class="rclose" id="rclose" type="button" aria-label="Back to the clips"></button><div class="phone">
    <div class="segs" id="segs" aria-hidden="true"></div>
    <p class="pos" id="pos" aria-live="polite"></p>
    <div class="nav">
      <button id="prev" aria-label="Previous clip">&#8593;</button>
      <button id="next" aria-label="Next clip">&#8595;</button>
    </div>
    <div class="feed" id="feed" tabindex="0" role="feed"
       aria-label="Vertical clip feed"><p class="msg">Loading…</p></div></div></div>
</div>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Escaping doesn't stop `javascript:` in an href or src, so gate the scheme too. */
const safeUrl = (u) => (/^(https?:|\/|data:image\/)/i.test(String(u || '').trim()) ? u : '');
const IC = {
  like:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8.5-5.4-8.5-11A4.8 4.8 0 0 1 12 6.6 4.8 4.8 0 0 1 20.5 10c0 5.6-8.5 11-8.5 11z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 12v8h16v-8"/><path d="M12 16V3"/><path d="M7 8l5-5 5 5"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v6H4V6h6"/></svg>',
  muted:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 5l14 14M19 5L5 19"/></svg>',
  expand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
};
const likes = {
  read(){ try { return JSON.parse(localStorage.getItem('txfeed.likes') || '{}'); } catch { return {}; } },
  write(v){ try { localStorage.setItem('txfeed.likes', JSON.stringify(v)); } catch {} },
};
let DATA = { clips: [], collections: [] }, active = 'all', liked = likes.read();

/* ---------- where this feed sits ---------------------------------------------
 * One page, several placements. ?layout=rail renders a row of tiles the width of the slot
 * (the roster) instead of the phone; ?placement= names the slot in every event so the same
 * fan can be compared across surfaces; ?focus= is the player whose page this is, and the
 * server lifts that player's cards above everything else for it. Each is matched, never
 * trusted: an unknown value is simply dropped.
 */
const PAGE = (() => {
  const q = new URLSearchParams(location.search);
  const pick = (v, re) => (re.test(String(v ?? '')) ? String(v) : null);
  return {
    layout: q.get('layout') === 'rail' ? 'rail' : 'feed',
    placement: pick(q.get('placement'), /^[a-z0-9_-]{1,40}$/),
    focus: pick(q.get('focus'), /^[a-z0-9][a-z0-9-]{1,59}$/),
    // One collection only, with the chip bar gone: the /community page shows community
    // cards and nothing else. An unknown key is ignored and the whole feed is served.
    collection: pick(q.get('collection'), /^[a-z][a-z0-9_-]{1,30}$/),
    // Only these card formats (video, read, listen): the news page lists its own stories.
    formats: String(q.get('formats') || '').split(',').map((s) => s.trim()).filter((s) => ['video', 'read', 'listen'].includes(s)),
    // Verification traffic: every event from this load says so, and the reviews leave it out.
    // On the live host page the iframe URL is the site's, so a browser run marks itself
    // with "txfeed-qa" in its user agent instead.
    qa: q.get('qa') === '1' || /txfeed-qa/.test(navigator.userAgent),
  };
})();
if (PAGE.layout === 'rail') document.body.classList.add('rail-mode');
/** /api/feed for the person watching, on the page they are on. */
const feedUrl = (who) => {
  const q = new URLSearchParams();
  if (who) q.set(who.startsWith('sid=') ? 'sid' : 'did', who.slice(4));
  if (PAGE.focus) q.set('focus', PAGE.focus);
  if (PAGE.formats.length) q.set('formats', PAGE.formats.join(','));
  const qs = q.toString();
  return '/api/feed' + (qs ? `?${qs}` : '');
};

/* ---------- is this a returning fan? -------------------------------------------
 * The id says who; this says how often. A visit is a load more than 30 minutes after the
 * last one on this device. Kept beside the device id, under the same consent: a visitor who
 * declined measurement gets no counter at all. Read once per load, as feed_load goes out.
 */
const VISIT_GAP_MS = 30 * 60e3;
let VISIT = null;
function visitParams() {
  if (VISIT) return VISIT;
  if (!measuring) return (VISIT = {});
  try {
    const k = 'txfeed.visits';
    let v = {};
    try { v = JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch { v = {}; }
    const now = Date.now();
    const last = Number(v.last) || 0, n = Number(v.n) || 0;
    const fresh = !last || now - last >= VISIT_GAP_MS;
    const visit_n = fresh ? n + 1 : Math.max(n, 1);
    VISIT = { visit_n, returning: visit_n > 1, ...(visit_n > 1 && last ? { days_since: Math.round((now - last) / 864e5) } : {}) };
    localStorage.setItem(k, JSON.stringify({ n: visit_n, last: now, first: Number(v.first) || now }));
  } catch { VISIT = {}; }
  return VISIT;
}

/* ---------- knobs ------------------------------------------------------------
 * The dials an experiment may turn, with their defaults. /api/feed hands back the values for
 * this visitor's arms; anything it names that is not here is ignored. */
const KNOB_DEFAULTS = { picker_position: 2, picker_reoffer_days: 7, reason_pills: 'explicit', sound_hint: false, capture_card: null,
  offer_position: 2, expiry_position: 1, week_position: 4, ask_position: 7, lead_tagged: 0, chip_hold: 0 };
/** One follow-up question per load, so a fan is never asked twice in one sitting. */
let askedThisLoad = false;
/** Fewer views than this in a week and there is no "your week" to show. Mirrors WEEK_MIN_VIEWS in src/rank.js. */
const WEEK_MIN = 5;
let knobs = { ...KNOB_DEFAULTS };
let forcePicker = false;
/** What the Worker knows about a recognised fan, once asked; null until then or when nothing is known. */
let welcomeInfo = null;
let welcomeAsked = false;
/** The pick to offer on the next card, earned by a completed clip; null when nothing is owed. */
let pendingChip = null;
const CHIP_MS = 7000;
const swipedKey = 'txfeed.prefs.swiped';
let soundHinted = false;
const skipKey = 'txfeed.prefs.skip';
/** Things the fan has already seen or declined: "boost:draft-week", "week:2970", "offer:giants-week". */
const seenKey = 'txfeed.seen';
const seenAll = () => { try { return JSON.parse(localStorage.getItem(seenKey) || '{}') || {}; } catch { return {}; } };
const seen = (kind, key, withinMs = Infinity) => { const t = Number(seenAll()[`${kind}:${key}`] || 0); return t > 0 && Date.now() - t < withinMs; };
const markSeen = (kind, key) => { try { const all = seenAll(); all[`${kind}:${key}`] = Date.now(); localStorage.setItem(seenKey, JSON.stringify(all)); } catch {} };
const weekStamp = () => Math.floor(Date.now() / (7 * 86400e3));
const skippedRecently = () => {
  try {
    const t = Number(localStorage.getItem(skipKey) || 0);
    if (t > 0 && (Date.now() - t) < (Number(knobs.picker_reoffer_days) || 7) * 86400e3) return true;
    // A fan who looked at the picker and swiped past said no without saying it: not again today.
    const sw = Number(localStorage.getItem(swipedKey) || 0);
    return sw > 0 && (Date.now() - sw) < 86400e3;
  } catch { return false; }
};

/* ---------- analytics ----------------------------------------------------------
 * Two sinks, both optional, neither load-bearing. GA4 fires only when a measurement
 * id is configured — with none, no third-party script is fetched at all. Every event
 * is also posted to the parent frame, so the page embedding this feed can bridge it
 * into whatever it already runs (Adobe, Parse.ly) without us knowing which.
 *
 * Nothing here carries personal data: card ids, collections, positions and durations.
 * That is deliberate — postMessage goes to '*', because an embed cannot know its host.
 */
/**
 * Resolved after the feed loads, not at parse time: the server's id arrives with the
 * data. ?ga= wins, so one deployment can report into different properties per placement.
 */
function resolveGA() {
  const id = new URLSearchParams(location.search).get('ga') || DATA.analytics?.ga4 || '';
  // This value reaches a script src, so it is matched, never interpolated on trust.
  return /^G-[A-Z0-9]{4,20}$/i.test(id) ? id : null;
}

function loadGA(id) {
  if (!id || window.gtag) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  gtag('js', new Date());
  // The feed is an iframe. An automatic page_view here would double-count against the
  // page that frames it, so measurement is events only.
  gtag('config', id, { send_page_view: false, transport_type: 'beacon' });
  const sc = document.createElement('script');
  sc.async = true;
  sc.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(id)}`;
  document.head.appendChild(sc);
}

/* ---------- who is watching --------------------------------------------------
 * Two identifiers, both pseudonymous, neither personal.
 *
 * `pocket_id` is the host site's own anonymous id. It lives in localStorage on
 * houstontexans.com, and this feed is served from a different origin — so it cannot read
 * that drawer and the host has to hand it over. Two ways in, both below.
 *
 * `device_id` is ours, minted here, used when no host id arrives: a standalone /feed, an
 * app webview, a host that has not wired the handshake yet. Without it the first sessions
 * of any new placement would carry no identity at all.
 *
 * Neither is an account. Nothing here resolves to a person — that happens later, elsewhere,
 * and only with an address someone chose to give.
 */
const ID_SHAPE = /^[A-Za-z0-9._:-]{6,128}$/;

let pocketId = null;
/**
 * The Eloqua visitor GUID the host passes with the pocket id (handshake v3). A pseudonymous
 * visitor key Eloqua already holds; for a fan who has ever clicked a club email it resolves to
 * a contact there, so the session can be recognised without asking. Shape-checked, sent once
 * on the identity event, never used here for anything else.
 */
let eloquaGuid = null;
const ELQ_GUID = /^[0-9A-Fa-f]{32}$/;

/**
 * Minting our own id is the same act the host site gates behind OneTrust performance
 * consent (C0002) — a different origin does not make it a different act. So it is lazy, and
 * a host that tells us consent was declined gets no identifier minted at all. Declining
 * measurement on houstontexans.com has to mean declining it in the feed embedded there.
 */
let measuring = true;
let deviceId = null;

function mintDevice() {
  if (!measuring || deviceId) return deviceId;
  try {
    const k = 'txfeed.device';
    let v = localStorage.getItem(k);
    // Self-minted and per-origin, so it survives a republish and reaches nobody else.
    if (!ID_SHAPE.test(v || '')) {
      v = `dv-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
      localStorage.setItem(k, v);
    }
    deviceId = v;
  } catch { deviceId = null; }   // private window, blocked storage — the feed still works
  return deviceId;
}

/**
 * Events raised before identity resolves would go out anonymous, and feed_load and the
 * first card_view are the two most valuable in the stream. Hold them briefly, then give up
 * — a host that never answers must not cost us the session.
 */
const HANDSHAKE_MS = 1200;
/**
 * How long the first /api/feed request waits for the host to say who is watching, so the
 * feed can be ordered for them from the first card. A Texans page answers in a few
 * milliseconds; a host that never answers costs at most this.
 */
const RANK_WAIT_MS = 400;
let identified = false;
let pending = [];
let onIdentified = null;
const identityOrWait = (ms) => new Promise((done) => {
  if (identified) return done();
  const t = setTimeout(() => { onIdentified = null; done(); }, ms);
  onIdentified = () => { clearTimeout(t); onIdentified = null; done(); };
});

function setPocketId(value, how) {
  if (identified) return;
  if (!ID_SHAPE.test(String(value ?? ''))) return;
  pocketId = String(value);
  identified = true;
  flush(how);
}

/** Built at send time, never at queue time — see the note in track(). */
const payloadFor = (params) => ({
  feed_collection: active,
  ...(PAGE.qa ? { qa: true } : {}),
  ...(pocketId ? { pocket_id: pocketId } : {}),
  ...(mintDevice() ? { device_id: deviceId } : {}),
  ...params,
});

function flush(how) {
  identified = true;
  onIdentified?.();
  const queued = pending;
  pending = [];
  // Identity first, so a consumer knows who the events that follow belong to. It goes
  // through payloadFor like everything else; emitted raw, it carried no ids at all.
  if (how) emit('identity', payloadFor({ identity_source: how, ...(eloquaGuid ? { eloqua_guid: eloquaGuid } : {}) }));
  for (const [event, params] of queued) emit(event, payloadFor(params));
}

function emit(event, payload) {
  // `hello` is the one message that must go out regardless: it is how we learn whether we
  // are allowed to measure at all, and it carries nothing.
  if (!measuring && event !== 'hello') return;
  // Stamped here, not when the params were built: by now the host has said whether we may
  // measure at all, so a visitor who declined never gets a counter written.
  if (event === 'feed_load') payload = { ...payload, ...visitParams() };
  try { window.gtag?.('event', event, payload); } catch { /* never break the feed */ }
  try { keep(event, payload); } catch { /* likewise */ }
  try {
    // Framed, this reaches the host page. Unframed, it reaches this page — so anyone
    // integrating can open /feed directly, listen for 'message', and watch the stream
    // without standing up an embedder first.
    (window.parent !== window ? window.parent : window)
      .postMessage({ source: 'txfeed', event, params: payload }, '*');
  } catch { /* a cross-origin parent that refuses messages is not our problem */ }
}

/* ---------- what fans do, kept ------------------------------------------------
 * Events also go back to the origin that served this feed, in small batches, when its
 * /api/feed names an endpoint (DATA.analytics.events). Until DATA arrives they wait; an
 * origin that names none means they are dropped. Nothing is ever sent anywhere the feed was
 * not told to send it, and nothing is sent at all for a visitor who declined measurement,
 * because emit() returns before keep() for them.
 */
let outbox = [];
let outboxTimer = null;
const eventsUrl = () => (typeof DATA?.analytics?.events === 'string' && DATA.analytics.events.startsWith('/'))
  ? DATA.analytics.events : null;

function keep(event, payload) {
  if (event === 'hello') return;
  outbox.push({ event, params: payload, at: new Date().toISOString() });
  if (outbox.length >= 20) return postOutbox();
  if (!outboxTimer) outboxTimer = setTimeout(postOutbox, 2000);
}

function postOutbox() {
  clearTimeout(outboxTimer); outboxTimer = null;
  if (!DATA.generatedAt) return;           // /api/feed has not answered yet; hold
  const url = eventsUrl();
  const batch = outbox; outbox = [];
  if (!url || !batch.length) return;
  const body = JSON.stringify({ events: batch });
  try {
    // text/plain keeps sendBeacon on the no-preflight path; the server parses JSON anyway.
    if (navigator.sendBeacon?.(url, new Blob([body], { type: 'text/plain;charset=UTF-8' }))) return;
  } catch { /* fall through to fetch */ }
  fetch(url, { method: 'POST', body, keepalive: true,
    headers: { 'content-type': 'text/plain;charset=UTF-8' } }).catch(() => {});
}
addEventListener('pagehide', postOutbox);

function track(event, params = {}) {
  // Queue the raw params, not a finished payload: building it here froze the ids as they
  // were at queue time, so a host that replied 400ms in still had feed_load go out
  // anonymous while the very next event carried the id.
  if (!identified) { pending.push([event, params]); return; }
  emit(event, payloadFor(params));
}

/**
 * The host's half of the handshake. Either is enough:
 *
 *   1. `?pid=` on the iframe src — one attribute, nothing to script. Best for a CMS that
 *      can interpolate a value into a URL and not much else.
 *   2. A reply to the `txfeed-hello` this page posts on boot:
 *
 *        window.addEventListener('message', (e) => {
 *          if (e.data?.source !== 'txfeed' || e.data.event !== 'hello') return;
 *          e.source.postMessage({ source: 'txfeed-host', pocketId: myPocketId }, '*');
 *        });
 *
 * The id is treated as a pseudonym and nothing more. It arrives from a frame we do not
 * control, so it is shape-checked, never trusted as proof of who anyone is, and never used
 * on its own to reach an account. Resolving it to a person needs a signed token, which is a
 * deliberate later step and not this.
 */
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.source !== 'txfeed-host') return;
  // An explicit `consent: false` is the host saying this visitor declined measurement. Act
  // on it before anything else: stop measuring, and drop anything already queued.
  if (d.consent === false) {
    measuring = false;
    pending = [];
    identified = true;
    onIdentified?.();
    return;
  }
  const guid = typeof d.eloquaGuid === 'string' && ELQ_GUID.test(d.eloquaGuid) ? d.eloquaGuid.toLowerCase() : null;
  // A page can carry two handshake copies for a while (an older one in a shared module, a newer
  // one in the page). The older answers first, without the GUID. When a later answer brings it,
  // record it on a second identity event rather than lose it.
  if (identified && guid && !eloquaGuid && measuring) {
    eloquaGuid = guid;
    emit('identity', payloadFor({ identity_source: 'host-message', eloqua_guid: guid }));
    welcome();
    return;
  }
  if (guid) eloquaGuid = guid;
  if (d.pocketId == null) { flush('device'); return; }
  setPocketId(d.pocketId, 'host-message');
  welcome();
});

/**
 * A recognised fan is welcomed with what the club already knows: the picks they saved in an
 * earlier session, now applied here too, or the player they watch most. Asked once per load,
 * only with the knob on, only when measuring, and shown once a day. Nothing known, nothing shown.
 */
async function welcome() {
  if (welcomeAsked || !eloquaGuid || !measuring || !DATA || !Number(knobs.welcome_card)) return;
  if (seen('welcome', 'shown', 86400e3)) return;
  const sid = whoAmI();
  if (!sid) return;
  welcomeAsked = true;
  try {
    const r = await fetch('/api/who', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ guid: eloquaGuid, sid }) });
    if (!r.ok) return;
    const d = await r.json();
    if (!d?.known || (!(d.picks || []).length && !d.player)) { track('welcome_skipped', { welcome_known: Boolean(d?.known) }); return; }
    welcomeInfo = d;
    markSeen('welcome', 'shown');
    // Picks copied onto this session: the feed is re-asked as them, so the order and the
    // reasons are already theirs when the card says so. Otherwise just redraw with the card.
    if (d.copied) await reload(null, 'welcome'); else { render(); }
    track('welcome_shown', { welcome_source: d.source, welcome_copied: Boolean(d.copied), card_id: 'sys-welcome' });
  } catch { /* a slow lookup is not a dark feed */ }
}
// The /enter page (same origin, in the modal) says when its form was submitted.
addEventListener('message', (e) => {
  if (e.data?.source === 'txfeed-enter' && e.data.event === 'submit') track('capture_submit', { card_id: 'sys-enter' });
});

/** The card dimensions every event carries, so any one of them can be sliced alike. */
const cardParams = (c, i) => ({
  card_id: c.id, card_collection: c.collection, card_source: c.source,
  card_kind: c.media?.kind || 'none', card_position: (i ?? 0) + 1,
  ...(c.clip ? { card_is_clip: true } : {}),
  ...(c.sponsor?.name ? { card_sponsor: c.sponsor.name } : {}),
});

// A card counts as seen once it has held the screen for a second — otherwise scrolling
// past ten cards to reach the eleventh reports as ten views.
//
// The open time lives on the slide, not in one shared variable. Both slides of a swipe
// arrive in the same observer callback, so a shared one was overwritten by the incoming
// card before the outgoing card's dwell had been read, and every exit was dropped.
const VIEW_AFTER_MS = 1000;

function cardOpened(slide, c, i) {
  if (slide._seenAt) return;
  slide._seenAt = Date.now();
  clearTimeout(slide._seenTimer);
  slide._seenTimer = setTimeout(() => track('card_view', cardParams(c, i)), VIEW_AFTER_MS);
  if (pendingChip && !c.system) { const chip = pendingChip; pendingChip = null; showChip(slide, c, i, chip); }
}
function cardClosed(slide, c, i, complete) {
  clearTimeout(slide._seenTimer);
  if (!slide._seenAt) return;
  const dwell = Date.now() - slide._seenAt;
  slide._seenAt = 0;
  slide.querySelector('.pickchip')?.remove();
  if (dwell < VIEW_AFTER_MS) return;
  track(complete ? 'card_complete' : 'card_exit',
    { ...cardParams(c, i), card_dwell_ms: dwell });
  // Looked at the picker and swiped past: that is a no, and it is not asked again today.
  if (c.id === 'sys-picker' && !DATA.prefs) {
    try { localStorage.setItem(swipedKey, String(Date.now())); } catch {}
    track('prefs_swipe', { ...cardParams(c, i), card_dwell_ms: dwell });
  }
  // A completed clip about a player earns one tap on the next card: "More Tank Dell".
  if (complete && knobs.pick_prompt === 'chip' && !c.system && whoAmI() && DATA.picker) {
    const player = (c.entities?.players || [])[0];
    const have = DATA.prefs?.players || [];
    const room = have.length < (Number(DATA.picker?.max_players) || 3);
    if (player && !have.includes(player) && room && !seen('chip', player, 86400e3)) {
      pendingChip = { player, name: playerName(player), from: c.id };
    } else if (!player) {
      // No player is the point of this clip: offer the lane it is in ("More Gameday hype").
      const lane = laneForCard(c);
      const wants = DATA.prefs?.wants || [];
      if (lane && !wants.includes(lane.key) && !seen('chip', `lane:${lane.key}`, 86400e3)) pendingChip = { lane: lane.key, name: lane.name, from: c.id };
    }
  }
}

/** The lane a card is in, by what it is about, from the lane table the server sent with the picker. */
const laneForCard = (c) => (DATA.picker?.lanes || []).find((l) => (l.types || []).includes(c?.contentType) || (l.themes || []).some((t) => (c?.entities?.themes || []).includes(t))) || null;

const playerName = (player) => DATA.picker?.players?.find((p) => p.slug === player)?.name || (DATA.focus?.slug === player ? DATA.focus.name : null) || displayName(player);

/** One tap, on the card, after the clip that earned it. Fades on its own; a swipe removes it. */
function showChip(slide, c, i, chip) {
  if (slide.querySelector('.pickchip')) return;
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'pickchip';
  btn.innerHTML = `More <b>${esc(chip.name)}</b>`;
  btn.setAttribute('aria-label', `More ${chip.name}: make this a pick`);
  btn.onclick = () => pickFromChip(slide, c, i, chip);
  slide.appendChild(btn);
  requestAnimationFrame(() => btn.classList.add('in'));
  markSeen('chip', chip.lane ? `lane:${chip.lane}` : chip.player);
  track('pick_chip_shown', { ...cardParams(c, i), ...(chip.lane ? { pref_lane: chip.lane } : { pref_player: chip.player }), chip_from: chip.from });
  // chip_hold: the chip stays until the fan swipes; otherwise it fades after CHIP_MS.
  if (!Number(knobs.chip_hold)) setTimeout(() => { if (!btn.classList.contains('done') && !btn.disabled) { btn.classList.remove('in'); setTimeout(() => btn.remove(), 300); } }, CHIP_MS);
}

/** The tap: save the pick without leaving the card, lift that player's clips to come next, and say so on the chip. */
async function pickFromChip(slide, c, i, chip) {
  const btn = slide.querySelector('.pickchip');
  if (btn) btn.disabled = true;
  const base = DATA.prefs || {};
  const players = chip.lane ? (base.players || []) : [...(base.players || []), chip.player];
  const wants = chip.lane ? [...(base.wants || []), chip.lane] : (base.wants || []);
  const body = { players, wants, format: base.format || null, follow: base.follow || null,
    boosts: (base.boosts || []).map((b) => ({ key: b.key, until: b.until, label: b.label })), going: base.going || null, watch: base.watch || null,
    source: 'chip', ...(pocketId ? { pocket_id: pocketId } : {}), ...(mintDevice() ? { device_id: deviceId } : {}) };
  try {
    const r = await fetch('/api/prefs', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(String(r.status));
    const res = await r.json();
    DATA.prefs = res.prefs || { ...base, players, wants };
    track('prefs_save', { ...cardParams(c, i), players_n: players.length, wants_n: wants.length, pref_format: body.format || '', pref_follow: body.follow || '',
      boosts_n: body.boosts.length, pref_going: body.going || '', pref_watch: body.watch || '', save_source: 'chip', ...(chip.lane ? { pref_lane: chip.lane } : { pref_player: chip.player }), chip_from: chip.from });
    const lifted = chip.lane
      ? liftWhere((card) => (laneForCard(card) || {}).key === chip.lane, i, { kind: 'lane', key: chip.lane, label: `Because you want ${chip.name}` })
      : liftPlayer(chip.player, chip.name, i, { kind: 'pick', key: chip.player, label: `Because you picked ${chip.name}` });
    const said = chip.lane ? `${chip.name} first` : `${chip.name.split(' ').pop()} first`;
    if (btn) { btn.classList.add('done'); btn.innerHTML = `${esc(said)}${lifted ? '' : ', when there is more'}`; setTimeout(() => btn.remove(), 2400); }
    chips();
  } catch {
    if (btn) { btn.disabled = false; }
    flashOn(slide, 'Could not save. Try again.');
  }
}
// Autoplay requires muted, so the feed starts silent — but a presser clip is carried by
// what is said, and without a control nothing suggests there is audio at all.
let soundOn = false;
function applySound() {
  document.querySelectorAll('#feed video').forEach((v) => (v.muted = !soundOn));
  document.querySelectorAll('#feed iframe.yt').forEach((f) => ytCmd(f, soundOn ? 'unMute' : 'mute'));
  document.querySelectorAll('.rb.sound').forEach((b) => {
    b.setAttribute('aria-pressed', soundOn);
    // The label was set once at render and stayed "Unmute" after unmuting.
    b.setAttribute('aria-label', soundOn ? 'Mute' : 'Unmute');
    b.innerHTML = (soundOn ? IC.sound : IC.muted) + `<span>${soundOn ? 'Sound' : 'Muted'}</span>`;
  });
}

/* ---------- tap to play ----------------------------------------------------------
 * YouTube's terms allow its video only in its own player, unobscured. So a YouTube card is a
 * poster in the feed, and a tap hands the frame to that player with our bar above it, never
 * over it. The IFrame API is used for exactly one thing: knowing when the video ended, so the
 * feed can move on by itself. Closing early is a signal too; both are kept.
 */
const player = { slide: null, card: null, idx: 0, openedAt: 0 };
const YT_ORIGIN = /^https:\/\/www\.youtube(-nocookie)?\.com$/;
const YT_ID = /^[A-Za-z0-9_-]{6,20}$/;
/** If YouTube has not started within this long, the card behaves like a story again. */
const YT_START_MS = 8000;
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/** The IFrame API over postMessage: ask for events, send a command. */
const ytListen = (f) => { try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch {} };
const ytCmd = (f, func, args = []) => { try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*'); } catch {} };

/** Move on from a card: the next one, or on the last card flush its completion. */
function advanceFrom(slide) {
  slide._done = true;
  const feed = $('#feed');
  const i = Number(slide.dataset.index) || 0;
  if (slide.nextElementSibling) feed.scrollBy({ top: feed.clientHeight, behavior: 'smooth' });
  else if (cardOf(slide)) cardClosed(slide, cardOf(slide), i, true);
}

/** The story clock: fill the segment over `hold` seconds, then advance. */
function armHold(slide) {
  const fill = $('#segs .fill');
  const hold = Number(slide.dataset.hold) || 6;
  if (fill) {
    fill.style.transition = 'none'; fill.style.width = '0%';
    requestAnimationFrame(() => { fill.style.transition = `width ${hold}s linear`; fill.style.width = '100%'; });
  }
  clearTimeout(slide._t);
  slide._t = setTimeout(() => advanceFrom(slide), hold * 1000);
}

/* In-feed: the active YouTube card gets YouTube's player, muted until the fan asks for sound,
 * in the region above our band. The poster stays until the player says it is playing. If it
 * never does (offline, blocked, not embeddable) the card falls back to the story hold. */
function mountYt(slide, c) {
  const id = String(c?.media?.videoId || '');
  if (!YT_ID.test(id) || slide._yt) return;
  const q = new URLSearchParams({ autoplay: '1', mute: '1', controls: '0', playsinline: '1', rel: '0',
    modestbranding: '1', enablejsapi: '1', origin: location.origin });
  const f = document.createElement('iframe');
  f.className = 'yt';
  f.src = `https://www.youtube-nocookie.com/embed/${id}?${q}`;
  f.title = c.headline;
  f.allow = 'autoplay; encrypted-media';
  f.tabIndex = -1;
  f.addEventListener('load', () => ytListen(f));
  slide.appendChild(f);
  slide._yt = { f, started: false, auto: slide.dataset.advance !== 'manual' };
  slide._ytFallback = setTimeout(() => {
    if (slide._yt && !slide._yt.started) { unmountYt(slide); armHold(slide); }
  }, YT_START_MS);
}
function unmountYt(slide) {
  clearTimeout(slide._ytFallback); slide._ytFallback = null;
  slide._yt?.f.remove();
  slide._yt = null;
  slide.classList.remove('yt-playing');
}

/* Expanded: the same player takes the whole frame with our bar above it. Reached from the band's
 * expand button, or from the poster when autoplay is off (reduced motion) or has not started. */
function openPlayer(slide, c, i) {
  const id = String(c.media?.videoId || '');
  if (!YT_ID.test(id)) return;
  if (player.slide) closePlayer(false);
  unmountYt(slide);
  if (slide._t) { clearTimeout(slide._t); slide._t = null; }
  const fill = $('#segs .fill');
  if (fill) { fill.style.transition = 'none'; fill.style.width = '100%'; }
  const q = new URLSearchParams({ autoplay: '1', playsinline: '1', rel: '0', modestbranding: '1',
    enablejsapi: '1', origin: location.origin });
  const f = document.createElement('iframe');
  f.src = `https://www.youtube-nocookie.com/embed/${id}?${q}`;
  f.title = c.headline;
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.setAttribute('allowfullscreen', '');
  f.addEventListener('load', () => ytListen(f));
  $('#player .pframe').replaceChildren(f);
  $('#p-title').textContent = c.headline;
  $('#player').hidden = false;
  $('#feed').setAttribute('inert', '');
  Object.assign(player, { slide, card: c, idx: i, openedAt: Date.now() });
  track('card_play', cardParams(c, i));
  $('#player .pclose').focus();
}

/** The same modal, holding a page of ours (the entry form) instead of YouTube's player. */
function openFrame(url, title) {
  if (player.slide) closePlayer(false);
  const f = document.createElement('iframe');
  f.src = url; f.title = title;
  $('#player .pframe').replaceChildren(f);
  $('#p-title').textContent = title;
  $('#player').hidden = false;
  $('#feed').setAttribute('inert', '');
  player.frame = true;
  $('#player .pclose').focus();
}

function closePlayer(ended) {
  const el = $('#player');
  if (player.frame) {
    player.frame = false;
    $('#player .pframe').replaceChildren();
    el.hidden = true;
    $('#feed').removeAttribute('inert');
    track('capture_close', { card_id: 'sys-enter' });
    return;
  }
  if (el.hidden || !player.slide) return;
  const secs = Math.round((Date.now() - player.openedAt) / 1000);
  track(ended ? 'card_play_complete' : 'card_play_close', { ...cardParams(player.card, player.idx), play_seconds: secs, play_mode: 'expanded' });
  $('#player .pframe').replaceChildren();
  el.hidden = true;
  $('#feed').removeAttribute('inert');
  const { slide, card } = player;
  player.slide = null; player.card = null;
  // Either way the card has been engaged with: leaving it is a completion, not an exit.
  slide._done = true;
  if (ended) { advanceFrom(slide); return; }
  slide.querySelector('.play')?.focus();
  // Back in the feed on the same card: pick the inline player back up where it belongs.
  if (!reducedMotion()) mountYt(slide, card);
}

addEventListener('message', (e) => {
  if (!YT_ORIGIN.test(e.origin)) return;
  let d;
  try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch { return; }
  if (!d || typeof d !== 'object') return;
  // State arrives two ways: onStateChange with a number, or infoDelivery with playerState.
  const state = d.event === 'onStateChange' ? d.info
    : d.event === 'infoDelivery' && d.info && typeof d.info.playerState === 'number' ? d.info.playerState : null;
  const modal = $('#player iframe');
  if (modal && e.source === modal.contentWindow) {
    if (state === 0) closePlayer(true);          // 0 is ENDED in the IFrame API's table
    return;
  }
  const slide = [...document.querySelectorAll('.slide.yt')].find((s2) => s2._yt && s2._yt.f.contentWindow === e.source);
  if (!slide) return;
  const st = slide._yt;
  const c = cardOf(slide);
  const i = Number(slide.dataset.index) || 0;
  if (d.event === 'onError') { unmountYt(slide); armHold(slide); return; }
  if (state === 1 && !st.started) {             // PLAYING, first time
    st.started = true;
    clearTimeout(slide._ytFallback); slide._ytFallback = null;
    slide.classList.add('yt-playing');
    if (soundOn) ytCmd(st.f, 'unMute');
    if (c) track('card_autoplay', cardParams(c, i));
    if (knobs.sound_hint && !soundOn && !soundHinted) { soundHinted = true; flashOn(slide, 'Tap Muted for sound'); }
  }
  if (state === 0 && st.started) {              // ENDED
    if (c) track('card_play_complete', { ...cardParams(c, i), play_mode: 'inline' });
    if (st.auto) advanceFrom(slide); else unmountYt(slide);
  }
});
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#player').hidden) closePlayer(false); });
$('#player .pclose').innerHTML = IC.close;
$('#player .pclose').onclick = () => closePlayer(false);

/** Placeholder art when a source gives no poster — deterministic per id, on-brand. */
function generated(id) {
  let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `<div class="gen" style="background:
    radial-gradient(120% 90% at 30% 10%, hsl(${h} 55% 17%), transparent 60%),
    linear-gradient(160deg,#02202f,#021118 70%)"></div>`;
}

/** Text and link blocks, positioned as a percentage of the frame. */
function overlaysFor(c) {
  if (!c.overlays?.length) return '';
  return `<div class="ovl">${c.overlays.map((o) => {
    const cls = `ov ${o.style} ${o.size} c-${o.color}`;
    const pos = o.style === 'band'
      ? `top:${o.y}%;text-align:${o.align}`
      : `left:${o.x}%;top:${o.y}%;text-align:${o.align}`;
    return o.type === 'link' && o.url
      ? `<a class="${cls}" style="${pos}" href="${esc(safeUrl(o.url))}" target="_blank" rel="noopener">${esc(o.text)}</a>`
      : `<p class="${cls}" style="${pos}">${esc(o.text)}</p>`;
  }).join('')}</div>`;
}

/** The default bottom block — suppressed when the card carries its own overlays. */
function chromeFor(c) {
  const show = c.chrome === 'on' || (c.chrome !== 'off' && !(c.overlays?.length));
  if (!show) return '';
  return `<div class="bot">
      ${whyFor(c)}<h2>${esc(c.headline)}</h2>
      ${c.caption ? `<p>${esc(c.caption)}</p>` : ''}
      ${c.action && safeUrl(c.action.url) ? `<a class="cta" href="${esc(c.action.url)}" target="_blank" rel="noopener">${esc(c.action.label)}</a>` : ''}
    </div>`;
}

function mediaFor(c) {
  const m = c.media || {};
  const fit = c.fit === 'contain' ? ' class="contain"' : '';
  if (m.kind === 'image')
    // data-fallback, empty, so the handler wired below removes a broken graphic and lets the
    // generated ground show through instead of the browser's broken-image glyph.
    return generated(c.id) + `<img${fit} src="${esc(safeUrl(m.url))}"
      alt="${esc(c.headline)}" loading="lazy" data-fallback="[]">`;
  if (m.kind === 'cloudinary' || m.kind === 'file') {
    const src = m.kind === 'cloudinary' ? m.mp4 : m.url;
    // The generated ground sits behind every video, so a slow or failed source still reads
    // as a designed card rather than a black rectangle.
    // A playback-time clip has to seek before it shows anything right, and a seek needs
    // metadata — so that one case preloads rather than waiting on play() to start loading.
    return generated(c.id) + `<video${fit} src="${esc(safeUrl(src))}"
      poster="${esc(safeUrl(c.poster[0]))}" playsinline muted loop
      preload="${c.clip?.playback ? 'metadata' : 'none'}"></video>`;
  }
  if (m.kind === 'youtube') {
    // YouTube's terms require its own player, so this item gets a poster rather than ours.
    // The fallback chain is attached in JS below — interpolating URLs into an onerror
    // attribute made every poster a script sink.
    const p = c.poster.map(safeUrl).filter(Boolean);
    return p.length
      ? `<img src="${esc(p[0])}" alt="" loading="lazy" data-fallback="${esc(JSON.stringify(p.slice(1)))}">`
      : generated(c.id);
  }
  const poster = safeUrl(c.poster[0]);
  return poster
    ? `<img src="${esc(poster)}" alt="" loading="lazy" data-fallback="[]">`
    : generated(c.id);
}

/* ---------- the preference layer, on the page -------------------------------
 * Two cards the feed inserts itself. The picker is how a fan tells us what they want and
 * sees the feed change for it on the spot, with a reason on every card it moved. The capture
 * card opens the club's Eloqua form (with the NFL privacy block) at /enter, carrying this
 * session's pseudonymous id so an entry can later be joined to what that fan watched. Both
 * are plain objects in the ContentItem shape so every event about them slices like any card.
 */
const whoAmI = () => pocketId || (measuring ? mintDevice() : null);
const fmtDay = (iso) => { const d = new Date(iso); return Number.isFinite(d.getTime()) ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''; };

const whyFor = (c) => {
  const w = c.why;
  if (!w?.label || knobs.reason_pills === 'off') return '';
  if (knobs.reason_pills !== 'all' && (w.kind === 'watch' || w.kind === 'affinity')) return '';
  return `<small class="why">${esc(w.label)}</small>`;
};
const firstReason = () => ROWS.find((r) => r.why?.label && !r.system)?.why.label || '';
/** The player this fan is about: their first pick, else the page's player, else nobody. */
function myPlayer() {
  const slug = DATA.prefs?.players?.[0] || DATA.focus?.slug || null;
  if (!slug) return null;
  const name = DATA.picker?.players?.find((p) => p.slug === slug)?.name || (DATA.focus?.slug === slug ? DATA.focus.name : null) || slug.replace(/-/g, ' ');
  return { slug, name };
}
const personal = (text) => String(text || '').replaceAll('{{player}}', myPlayer()?.name || 'Texans');

const systemCard = (id, headline, system, extra = {}) => ({ id, source: 'system', status: 'published', collection: 'gameday', headline,
  caption: null, media: { kind: 'none' }, poster: [], durationSeconds: 0, duration: '', publishedAt: null, action: null, sponsor: null,
  clip: null, entities: { players: [], opponent: null, themes: [] }, overlays: [], chrome: 'off', advance: { mode: 'manual', seconds: 6 },
  links: {}, flags: {}, sortIndex: 0, system, extra });

/** lead_tagged: the first player-tagged clip among the opening eight leads, so the first completed clip can earn a player chip. */
function leadTagged(rows) {
  if (!Number(knobs.lead_tagged)) return rows;
  const i = rows.findIndex((r, n) => n < 8 && r.source !== 'system' && (r.format || 'video') === 'video' && (r.entities?.players || []).length);
  if (i <= 0) return rows;
  const out = [...rows]; out.unshift(...out.splice(i, 1)); return out;
}

function withSystemCards(base) {
  const rows = leadTagged([...base]);
  if (!rows.length || active !== 'all') return rows;
  const pos = (n, len) => Math.max(0, Math.min(Number.isFinite(Number(n)) ? Number(n) : len, len));
  // Nothing to pick means nothing to offer: a feed with no tagged players gets no picker.
  const offer = DATA.picker?.players?.length && whoAmI() && (forcePicker || (knobs.pick_prompt !== 'chip' && !DATA.prefs && !skippedRecently() && Number(knobs.picker_position) >= 0));
  if (offer) rows.splice(forcePicker ? 0 : pos(knobs.picker_position, rows.length), 0, systemCard('sys-picker', DATA.prefs ? 'Your feed' : 'Make it yours', 'picker'));
  // A recognised fan's welcome sits at card 2: the first clip plays, then the club says what it knows.
  if (welcomeInfo && !forcePicker) rows.splice(pos(1, rows.length), 0, systemCard('sys-welcome', 'Welcome!', 'welcome', welcomeInfo));
  const cap = knobs.capture_card;
  // audience: 'all' (default), 'prefs' (only fans who have set their feed: the email ask comes
  // after the web payoff, never instead of it), 'new' (only fans who have not).
  const audienceOk = !cap?.audience || cap.audience === 'all' || (cap.audience === 'prefs' ? Boolean(DATA.prefs) : cap.audience === 'new' ? !DATA.prefs : true);
  if (cap && typeof cap === 'object' && cap.form && audienceOk) {
    // {{player}} becomes the fan's own player: "Win C.J. Stroud gear" to a Stroud fan.
    rows.splice(pos(cap.position ?? 5, rows.length), 0, systemCard('sys-enter', personal(String(cap.headline || 'Enter to win')).slice(0, 80), 'enter',
      { ...cap, blurb: personal(cap.blurb), cta: personal(cap.cta) }));
  }
  const me = whoAmI();
  const nowMs = Date.now();
  // A boost was a promise with a date on it. When the date passes, say so, once.
  const lapsed = (DATA.prefs?.boosts || []).find((b) => b.until && Date.parse(b.until) <= nowMs && !seen('boost', b.key));
  if (lapsed && me && Number(knobs.expiry_position) >= 0) {
    rows.splice(pos(knobs.expiry_position, rows.length), 0, systemCard('sys-expiry', `${lapsed.label || 'That boost'} is over.`, 'expiry', lapsed));
  }
  // A live offer for a fan who already has a feed; everyone else meets offers inside the picker.
  if (!offer && DATA.prefs && me && Number(knobs.offer_position) >= 0) {
    const have = new Set((DATA.prefs.boosts || []).map((b) => b.key));
    const o = (DATA.picker?.offers || []).find((x) => !have.has(x.key) && !seen('offer', x.key, (Number(knobs.picker_reoffer_days) || 7) * 86400e3));
    if (o) rows.splice(pos(knobs.offer_position, rows.length), 0, systemCard('sys-offer', `${o.label}?`, 'offer', o));
  }
  // One follow-up question per visit, only to a fan who has set their feed and only for what
  // they have not answered: the feed has paid off first, then it asks the next thing.
  if (DATA.prefs && me && Number(knobs.ask_position) >= 0 && !askedThisLoad) {
    const pr = DATA.prefs;
    const q = [
      !(pr.wants || []).length && (DATA.picker?.lanes || []).length ? 'lanes' : null,
      !pr.going ? 'going' : null,
      !pr.watch ? 'watch' : null,
    ].filter(Boolean).find((k) => !seen('ask', k, (Number(knobs.picker_reoffer_days) || 7) * 86400e3));
    if (q) {
      askedThisLoad = true;
      const head = { lanes: 'More of?', going: 'Going to a game this season?', watch: 'How do you watch?' }[q];
      rows.splice(pos(knobs.ask_position, rows.length), 0, systemCard('sys-ask', head, 'ask', { q }));
    }
  }
  // The fan's week, once a week, when there is enough of one to show.
  const w = DATA.week;
  if (w && w.views >= WEEK_MIN && me && Number(knobs.week_position) >= 0 && !seen('week', weekStamp())) {
    rows.splice(pos(knobs.week_position, rows.length), 0, systemCard('sys-week', 'Your week', 'week', w));
  }
  return rows;
}

/** "9 Tank Dell, 3 Will Anderson Jr and 5 TORO skits." The total is the stat beside it. */
function weekSentence(w) {
  const parts = [...(w.players || []).slice(0, 2).map((p) => `${p.n} ${p.name}`), ...(w.types || []).slice(0, 1).map((t) => `${t.n} ${t.name}`)];
  const list = parts.length > 1 ? `${parts.slice(0, -1).join(', ')} and ${parts[parts.length - 1]}` : parts[0] || '';
  return list ? `${list}.` : '';
}
/** What the week suggests asking for next: up to two lanes or a player the fan has not picked. */
function weekMore(w) {
  const pr = DATA.prefs || {}, have = new Set(pr.wants || []), picked = new Set(pr.players || []);
  const lanes = DATA.picker?.lanes || [];
  const out = [];
  for (const t of w.types || []) {
    const lane = lanes.find((l) => l.key === t.lane);
    if (lane && !have.has(lane.key) && !out.some((x) => x.k === lane.key)) out.push({ kind: 'lane', k: lane.key, label: `More ${lane.name.toLowerCase()}` });
  }
  const p = (w.players || []).find((x) => !picked.has(x.slug));
  if (p && (pr.players || []).length < (Number(DATA.picker?.max_players) || 3)) out.push({ kind: 'player', k: p.slug, label: `More ${p.name}` });
  return out.slice(0, 3);
}

function flashOn(slide, m) {
  const el = slide.querySelector('.flash');
  if (!el) return;
  el.textContent = m; el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(() => (el.hidden = true), 2200);
}
function toast(m, action = null) {
  const el = $('#toast');
  el.textContent = m; el.hidden = false;
  if (action) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tact'; b.textContent = action.label;
    b.onclick = () => { el.hidden = true; action.onClick(); };
    el.appendChild(b);
  }
  clearTimeout(el._t); el._t = setTimeout(() => (el.hidden = true), action ? 6000 : 3200);
}

/* ---------- a like answers back ------------------------------------------------
 * The fastest proof that the feed listens: like a card about a player and the cards about
 * that player still ahead of you move up, each labelled "Because you liked ...", and a toast
 * says so and offers to make it a pick. Nothing is saved unless the fan taps that; the lift
 * lasts the session. Seen cards never move, so the feed never jumps under the thumb.
 */
/**
 * Move a player's unseen cards to come next, in place, with a reason on each. Shared by a like
 * and a chip pick. Returns how many moved; a title that reads as a repeat of the current card or
 * of another lifted card never moves.
 */
function liftPlayer(player, name, at, why) {
  return liftWhere((c) => (c.entities?.players || []).includes(player), at, why);
}
function liftWhere(matches, at, why) {
  const feed = $('#feed');
  const slides = [...feed.querySelectorAll('.slide')];
  const cards = slides.map((s) => cardOf(s));
  const current = cards[at];
  const head = slides.slice(0, at + 1), tail = slides.slice(at + 1);
  const titleKey = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const seenTitles = new Set([titleKey(current?.headline)]);
  const hit = tail.filter((s) => {
    const c = cardOf(s);
    if (c.system || !matches(c)) return false;
    const k = titleKey(c.headline);
    if (seenTitles.has(k)) return false;
    seenTitles.add(k); return true;
  });
  if (!hit.length) return 0;
  const rest = tail.filter((s) => !hit.includes(s));
  for (const s of hit) {
    const c = cardOf(s);
    if (!c.why || c.why.kind === 'watch' || c.why.kind === 'affinity') {
      c.why = why;
      const host = s.querySelector('.bot') || s.querySelector('.band b');
      if (host && !host.querySelector('.why')) host.insertAdjacentHTML('afterbegin', `<small class="why">${esc(why.label)}</small>`);
    }
  }
  const order = [...head, ...hit, ...rest];
  ROWS = order.map((s) => cards[slides.indexOf(s)]);
  for (const s of [...hit, ...rest]) feed.appendChild(s);
  order.forEach((s, i) => { s.dataset.index = String(i); s.setAttribute('aria-posinset', String(i + 1)); });
  if (PAGE.layout === 'rail') renderTiles(ROWS, (k) => (DATA.collections.find((c) => c.key === k) || {}).name || k);
  return hit.length;
}

function likeLift(card, at) {
  const player = (card.entities?.players || [])[0];
  if (!player) return;
  const name = playerName(player);
  const lifted = liftPlayer(player, name, at, { kind: 'like', key: player, label: `Because you liked ${name}` });
  if (!lifted) return;
  track('like_lift', { ...cardParams(card, at), pref_player: player, lifted_n: lifted });
  const canPick = whoAmI() && DATA.picker && !(DATA.prefs?.players || []).includes(player) && (DATA.prefs?.players || []).length < (Number(DATA.picker?.max_players) || 3);
  const slide = $('#feed').querySelector(`.slide[data-index="${at}"]`);
  toast(`Noted. More ${name}, coming up.`, canPick ? { label: 'Add to my picks', onClick: () => savePrefs({ players: [...(DATA.prefs?.players || []), player] }, 'like', card, at, { pref_player: player })
    .then(() => toast(`${name} is one of your picks now.`)).catch(() => flashOn(slide, 'Could not save. Try again.')) } : null);
}
/** "c-j-stroud" → "C J Stroud" when the dictionary has no better name. */
const displayName = (slug) => String(slug || '').split('-').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

const loadParams = (why) => ({
  feed_cards: ROWS.length, feed_collections: DATA.collections.length, feed_rank: DATA.analytics?.rank || 'shared',

/** Fetch the feed again as the person watching, after their preferences changed. */
async function reload(prefs, why) {
  const who = pocketId ? `sid=${pocketId}` : (measuring && mintDevice()) ? `did=${deviceId}` : '';
  DATA = await (await fetch(feedUrl(who))).json();
  // askedThisLoad stays: a save that reloads the feed is the same sitting, not a new visit.
  if (prefs && !DATA.prefs) DATA.prefs = prefs;
  knobs = { ...KNOB_DEFAULTS, ...(DATA.knobs || {}) };
  chips(); render(); $('#feed').scrollTop = 0;
  track('feed_load', loadParams(why));
}

/**
 * One save for every way a fan tells us something: the picker (everything at once), an offer
 * (one boost), the weekly card (one lane or player). Starts from what is saved, applies the
 * change, posts, reports, reloads the feed as them.
 */
async function savePrefs(changes, source, card, at, extra = {}) {
  const base = DATA.prefs || {};
  const body = { players: base.players || [], wants: base.wants || [], format: base.format || null, follow: base.follow || null,
    boosts: (base.boosts || []).map((b) => ({ key: b.key, until: b.until, label: b.label })), going: base.going || null, watch: base.watch || null,
    ...changes, source, ...(pocketId ? { pocket_id: pocketId } : {}), ...(mintDevice() ? { device_id: deviceId } : {}) };
  const r = await fetch('/api/prefs', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(String(r.status));
  const res = await r.json();
  track('prefs_save', { ...cardParams(card, at), players_n: body.players.length, wants_n: body.wants.length,
    pref_format: body.format || '', pref_follow: body.follow || '', boosts_n: body.boosts.length,
    pref_going: body.going || '', pref_watch: body.watch || '', save_source: source, ...extra });
  await reload(res.prefs, 'prefs');
  return res;
}

function wireSystem(s, card, at) {
  const x = card.extra || {};
  if (card.system === 'enter') {
    s.querySelector('.go').onclick = () => {
      const mine = myPlayer();
      const q = new URLSearchParams({ pid: whoAmI() || '', form: String(x.form || ''), cid: String(x.campaign || ''), card: card.id, title: card.headline, ...(mine ? { term: mine.slug } : {}) });
      openFrame(`/enter?${q}`, card.headline);
      track('capture_open', { ...cardParams(card, at), ...(mine ? { pref_player: mine.slug } : {}) });
    };
    return;
  }
  if (card.system === 'welcome') {
    const done = (action) => { track('welcome_action', { ...cardParams(card, at), welcome_action: action, welcome_source: x.source }); welcomeInfo = null; };
    const ok = s.querySelector('.ok'), edit = s.querySelector('.edit'), yes = s.querySelector('.yes'), skip = s.querySelector('.skip:not(.edit)');
    if (ok) ok.onclick = () => { done('keep'); render(); $('#feed').scrollTop = Math.min(at, ROWS.length - 1) * $('#feed').clientHeight; };
    if (edit) edit.onclick = () => { done('edit'); forcePicker = true; render(); $('#feed').scrollTop = 0; };
    if (yes) yes.onclick = async () => {
      yes.disabled = true;
      try { await savePrefs({ players: [x.player] }, 'welcome', card, at, { welcome_action: 'more' }); welcomeInfo = null; }
      catch { yes.disabled = false; flashOn(s, 'Could not save. Try again.'); }
    };
    if (skip) skip.onclick = () => { done('skip'); render(); $('#feed').scrollTop = Math.min(at, ROWS.length - 1) * $('#feed').clientHeight; };
    return;
  }
  if (card.system === 'expiry') {
    s.querySelector('.ok').onclick = () => { markSeen('boost', x.key); track('boost_expired_seen', { ...cardParams(card, at), offer_key: x.key }); render(); };
    s.querySelector('.edit').onclick = () => { markSeen('boost', x.key); track('boost_expired_edit', { ...cardParams(card, at), offer_key: x.key }); forcePicker = true; render(); $('#feed').scrollTop = 0; };
    return;
  }
  if (card.system === 'offer') {
    const yes = s.querySelector('.yes');
    yes.onclick = async () => {
      yes.disabled = true;
      track('offer_accept', { ...cardParams(card, at), offer_key: x.key });
      try {
        await savePrefs({ boosts: [...(DATA.prefs?.boosts || []).map((b) => ({ key: b.key, until: b.until, label: b.label })), { key: x.key, until: x.ends_at, label: x.label }] }, 'offer', card, at, { offer_key: x.key });
        toast(`${x.label} is on until ${fmtDay(x.ends_at)}. Then back to your picks.`);
      } catch { yes.disabled = false; flashOn(s, 'Could not save. Try again.'); }
    };
    s.querySelector('.no').onclick = () => { markSeen('offer', x.key); track('offer_decline', { ...cardParams(card, at), offer_key: x.key }); render(); };
    return;
  }
  if (card.system === 'ask') {
    s.querySelectorAll('.answers .opt').forEach((b) => (b.onclick = async () => {
      s.querySelectorAll('.answers .opt').forEach((o) => (o.disabled = true));
      const k = b.dataset.k;
      const changes = x.q === 'lanes' ? { wants: [...(DATA.prefs?.wants || []), k] } : x.q === 'going' ? { going: k } : { watch: k };
      try {
        markSeen('ask', x.q);
        await savePrefs(changes, 'ask', card, at, { ask_q: x.q, ask_a: k });
        const why = firstReason();
        toast(x.q === 'watch' ? 'Noted. The pacing follows you.' : why ? `Noted. First up: ${why.toLowerCase()}.` : 'Noted.');
      } catch { s.querySelectorAll('.answers .opt').forEach((o) => (o.disabled = false)); flashOn(s, 'Could not save. Try again.'); }
    }));
    s.querySelector('.skip').onclick = () => { markSeen('ask', x.q); track('ask_skip', { ...cardParams(card, at), ask_q: x.q }); render(); };
    return;
  }
  if (card.system === 'week') {
    s.querySelectorAll('.more .opt').forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      const kind = b.dataset.kind, k = b.dataset.k;
      const changes = kind === 'lane' ? { wants: [...(DATA.prefs?.wants || []), k] } : { players: [...(DATA.prefs?.players || []), k] };
      try {
        markSeen('week', weekStamp());
        await savePrefs(changes, 'week', card, at, { week_more: `${kind}:${k}` });
        const why = firstReason();
        toast(why ? `Done. First up: ${why.toLowerCase()}.` : 'Done. Your feed has moved.');
      } catch { b.disabled = false; flashOn(s, 'Could not save. Try again.'); }
    }));
    s.querySelector('.skip').onclick = () => { markSeen('week', weekStamp()); track('week_skip', cardParams(card, at)); render(); };
    return;
  }
  const pk = s.querySelector('.pk');
  const max = Number(DATA.picker?.max_players) || 3;
  const group = (name, limit) => pk.querySelectorAll(`.${name} .opt`).forEach((b) => (b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';

    if (on && limit > 1 && pk.querySelectorAll(`.${name} .opt[aria-pressed="true"]`).length >= limit) { flashOn(s, `Up to ${limit} players`); return; }

  group('players', max); group('lanes', 99); group('format', 1); group('follow', 1); group('going', 1); group('watch', 1);

  pk.querySelectorAll('.offer .opt').forEach((b) => (b.onclick = () => {

    // The picker replaces everything: boosts the fan left pressed keep their dates and labels.
    const kept = new Map((DATA.prefs?.boosts || []).map((b) => [b.key, b]));
    const offers = DATA.picker?.offers || [];
    const boosts = picks('offer').map((k) => kept.get(k) || { key: k, until: offers.find((o) => o.key === k)?.ends_at, label: offers.find((o) => o.key === k)?.label });
    const changes = { players: picks('players'), wants: picks('lanes'), format: picks('format')[0] || null, follow: picks('follow')[0] || null,
      boosts, going: picks('going')[0] || null, watch: picks('watch')[0] || null };
    save.disabled = true;

  };
  pk.querySelector('.skip').onclick = () => {
    track(DATA.prefs ? 'prefs_cancel' : 'prefs_skip', cardParams(card, at));
    if (!DATA.prefs) { try { localStorage.setItem(skipKey, String(Date.now())); } catch {} }
