<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Texans Vertical Feed</title>
<style>
:root{--steel:#021118;--s2:#0a1d27;--s3:#13303d;--red:#eb0028;--red2:#ff123a;--blue:#0080c6;
 --w:#fff;--body:rgba(255,255,255,.84);--mute:rgba(255,255,255,.55);--line:rgba(255,255,255,.16);
 --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
 --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--steel);color:var(--w);font:15px/1.5 var(--sans);overflow:hidden}
.wrap{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:1180px;margin:0 auto;
 position:relative}

.bar{display:flex;gap:7px;padding:12px 16px 10px;overflow-x:auto;scrollbar-width:none;
 padding-top:calc(12px + env(safe-area-inset-top,0px))}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--line);color:var(--body);
 font:700 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;
 cursor:pointer;transition:all .14s var(--ease)}
.chip:hover{border-color:var(--red);color:var(--w)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.stage{position:relative;min-height:0;min-width:0;display:flex;justify-content:center;
 padding:0 16px 16px}
.phone{position:relative;aspect-ratio:9/16;height:100%;width:auto;max-width:100%;min-width:0;
 flex:0 1 auto;background:#000;border:1px solid var(--line);overflow:hidden}
@supports not (aspect-ratio:9/16){.phone{width:min(100%,56.25vh)}}
.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;
 scrollbar-width:none;-webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.slide>img,.slide>video,.slide>iframe{position:absolute;inset:0;width:100%;height:100%;
 object-fit:cover;border:0;display:block}
.slide>video{background:transparent}
.gen{position:absolute;inset:0}
.st,.sb{position:absolute;left:0;right:0;pointer-events:none}
.st{top:0;height:32%;background:linear-gradient(180deg,rgba(2,17,24,.8),transparent)}
.sb{bottom:0;height:54%;background:linear-gradient(0deg,rgba(2,17,24,.95) 8%,rgba(2,17,24,.5) 46%,transparent)}
.segs{position:absolute;top:9px;left:9px;right:9px;display:flex;gap:3px;z-index:6;
 pointer-events:none}
.pos{position:absolute;top:19px;right:11px;z-index:6;margin:0;font-size:9.5px;
 letter-spacing:.12em;color:rgba(255,255,255,.75);text-shadow:0 1px 4px rgba(0,0,0,.9);
 pointer-events:none}
.segs i{flex:1;height:2px;background:rgba(255,255,255,.26)}
.segs i.on{background:#fff}
.segs i.cur{background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.segs i.cur .fill{position:absolute;inset:0 auto 0 0;width:0;background:#fff;display:block}
.top{position:absolute;top:34px;left:11px;right:11px;z-index:3;display:flex;gap:7px;align-items:center}
.coll{font:900 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;background:var(--red);
 padding:4px 7px}
.coll.sp{background:var(--blue)}
.dur{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.75)}
.bot{position:absolute;left:11px;right:56px;bottom:calc(13px + env(safe-area-inset-bottom,0px));z-index:3}
.bot h2{font:900 23px/.92 var(--sans);text-transform:uppercase;letter-spacing:-.01em;margin:0 0 7px;
 text-wrap:balance}
.bot p{font-size:12.5px;line-height:1.45;color:var(--body);margin:0 0 10px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cta{display:inline-flex;align-items:center;background:var(--red);color:#fff;border:0;
 font:900 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:9px 13px;
 cursor:pointer;text-decoration:none;transition:background .14s var(--ease)}
.cta:hover{background:var(--red2)}
.cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
.flash{position:absolute;left:11px;right:56px;bottom:calc(60px + env(safe-area-inset-bottom,0px));
 z-index:5;margin:0;font-family:var(--mono);font-size:11px;background:rgba(2,17,24,.92);
 border:1px solid var(--line);padding:7px 10px;word-break:break-all}
.rail{position:absolute;right:7px;bottom:calc(15px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;
 gap:13px;align-items:center}
.rb{background:none;border:0;padding:0;cursor:pointer;color:#fff;display:flex;
 flex-direction:column;align-items:center;gap:3px}
.rb svg{width:24px;height:24px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.85))}
.rb span{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;
 text-shadow:0 1px 3px rgba(0,0,0,.9)}
.rb[aria-pressed="true"] svg{color:var(--red)}
.rb:focus-visible{outline:2px solid var(--red);outline-offset:3px}
/* ---- overlays: text and link blocks layered on the card ---- */
.ovl{position:absolute;inset:0;z-index:2;pointer-events:none}
.ov{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;max-width:86%;
 font-weight:900;text-transform:uppercase;line-height:.96;letter-spacing:-.01em;
 text-wrap:balance;margin:0;text-decoration:none;display:block}
.ov.band{left:0!important;transform:translateY(-50%);width:100%;max-width:100%;padding:10px 14px}
.ov.box{padding:9px 13px}
.ov.sm{font-size:clamp(11px,3.4cqw,15px)}
.ov.md{font-size:clamp(14px,4.8cqw,21px)}
.ov.lg{font-size:clamp(19px,7cqw,31px)}
.ov.xl{font-size:clamp(25px,10cqw,45px)}
.ov.c-white{color:#fff;text-shadow:0 2px 12px rgba(2,17,24,.75)}
.ov.c-red{color:var(--red);text-shadow:0 2px 12px rgba(2,17,24,.75)}
.ov.c-steel{color:var(--steel);text-shadow:none}
.ov.c-blue{color:var(--blue);text-shadow:0 2px 12px rgba(2,17,24,.75)}
.ov.band.c-white,.ov.box.c-white{background:#fff;color:var(--steel);text-shadow:none}
.ov.band.c-red,.ov.box.c-red{background:var(--red);color:#fff;text-shadow:none}
.ov.band.c-steel,.ov.box.c-steel{background:var(--steel);color:#fff;text-shadow:none}
.ov.band.c-blue,.ov.box.c-blue{background:var(--blue);color:#fff;text-shadow:none}
a.ov{transition:transform .14s var(--ease)}
a.ov:hover{transform:translate(-50%,-50%) scale(1.02)}
a.ov.band:hover{transform:translateY(-50%) scale(1.01)}
a.ov:focus-visible{outline:2px solid #fff;outline-offset:3px}
.slide{container-type:inline-size}
.slide>img.contain,.slide>video.contain{object-fit:contain;background:#000}
.nav{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:6;display:flex;
 flex-direction:column;gap:6px;opacity:0;transition:opacity .16s var(--ease)}
.phone:hover .nav,.nav:focus-within{opacity:1}
.nav button{background:rgba(2,17,24,.72);border:1px solid var(--line);color:#fff;width:30px;
 height:30px;padding:0;font-size:13px;cursor:pointer;line-height:1}
.nav button:hover{background:var(--red);border-color:var(--red)}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(hover:none){.nav{display:none}}
.msg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mute);
 font-size:14px;text-align:center;padding:24px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.feed{scroll-behavior:auto}}

/* ---- responsive overrides live last so they win over the base rules ---- */
/* On a phone this is the whole screen, not a preview of one — the gutters and the border
   were showing letterboxing on the exact device it gets embedded in. */
@media(max-width:600px){
  .stage{padding:0}
  .phone{border:0;aspect-ratio:auto;height:100%;width:100%}
  .wrap{grid-template-rows:1fr}
  /* Stacked in a fixed order down the top of the card: progress, then filters, then the
     card's own meta. Overlaying them all at the top collided. */
  .segs{top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px}
  .bar{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:0;right:0;z-index:7;
    padding:8px 12px 6px;background:linear-gradient(180deg,rgba(2,17,24,.8),transparent)}
  .pos{top:calc(9px + env(safe-area-inset-top,0px));right:10px}
  .top{top:calc(74px + env(safe-area-inset-top,0px))}
  .nav{display:none}
}
</style></head><body>
<div class="wrap">
  <div class="bar" id="bar" role="group" aria-label="Collections"></div>
  <div class="stage"><div class="phone">
    <div class="segs" id="segs" aria-hidden="true"></div>
    <p class="pos" id="pos" aria-live="polite"></p>
    <div class="nav">
      <button id="prev" aria-label="Previous clip">&#8593;</button>
      <button id="next" aria-label="Next clip">&#8595;</button>
    </div>
    <div class="feed" id="feed" tabindex="0" role="feed"
       aria-label="Vertical clip feed"><p class="msg">Loading…</p></div></div></div>
</div>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Escaping doesn't stop `javascript:` in an href or src, so gate the scheme too. */
const safeUrl = (u) => (/^(https?:|\/|data:image\/)/i.test(String(u || '').trim()) ? u : '');
const IC = {
  like:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8.5-5.4-8.5-11A4.8 4.8 0 0 1 12 6.6 4.8 4.8 0 0 1 20.5 10c0 5.6-8.5 11-8.5 11z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 12v8h16v-8"/><path d="M12 16V3"/><path d="M7 8l5-5 5 5"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v6H4V6h6"/></svg>',
  muted:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>',
};
const likes = {
  read(){ try { return JSON.parse(localStorage.getItem('txfeed.likes') || '{}'); } catch { return {}; } },
  write(v){ try { localStorage.setItem('txfeed.likes', JSON.stringify(v)); } catch {} },
};
let DATA = { clips: [], collections: [] }, active = 'all', liked = likes.read();

/* ---------- analytics ----------------------------------------------------------
 * Two sinks, both optional, neither load-bearing. GA4 fires only when a measurement
 * id is configured — with none, no third-party script is fetched at all. Every event
 * is also posted to the parent frame, so the page embedding this feed can bridge it
 * into whatever it already runs (Adobe, Parse.ly) without us knowing which.
 *
 * Nothing here carries personal data: card ids, collections, positions and durations.
 * That is deliberate — postMessage goes to '*', because an embed cannot know its host.
 */
/**
 * Resolved after the feed loads, not at parse time: the server's id arrives with the
 * data. ?ga= wins, so one deployment can report into different properties per placement.
 */
function resolveGA() {
  const id = new URLSearchParams(location.search).get('ga') || DATA.analytics?.ga4 || '';
  // This value reaches a script src, so it is matched, never interpolated on trust.
  return /^G-[A-Z0-9]{4,20}$/i.test(id) ? id : null;
}

function loadGA(id) {
  if (!id || window.gtag) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  gtag('js', new Date());
  // The feed is an iframe. An automatic page_view here would double-count against the
  // page that frames it, so measurement is events only.
  gtag('config', id, { send_page_view: false, transport_type: 'beacon' });
  const sc = document.createElement('script');
  sc.async = true;
  sc.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(id)}`;
  document.head.appendChild(sc);
}

function track(event, params = {}) {
  const payload = { feed_collection: active, ...params };
  try { window.gtag?.('event', event, payload); } catch { /* never break the feed */ }
  try {
    // Framed, this reaches the host page. Unframed, it reaches this page — so anyone
    // integrating can open /feed directly, listen for 'message', and watch the stream
    // without standing up an embedder first.
    (window.parent !== window ? window.parent : window)
      .postMessage({ source: 'txfeed', event, params: payload }, '*');
  } catch { /* a cross-origin parent that refuses messages is not our problem */ }
}

/** The card dimensions every event carries, so any one of them can be sliced alike. */
const cardParams = (c, i) => ({
  card_id: c.id, card_collection: c.collection, card_source: c.source,
  card_kind: c.media?.kind || 'none', card_position: (i ?? 0) + 1,
  ...(c.clip ? { card_is_clip: true } : {}),
  ...(c.sponsor?.name ? { card_sponsor: c.sponsor.name } : {}),
});

// A card counts as seen once it has held the screen for a second — otherwise scrolling
// past ten cards to reach the eleventh reports as ten views.
//
// The open time lives on the slide, not in one shared variable. Both slides of a swipe
// arrive in the same observer callback, so a shared one was overwritten by the incoming
// card before the outgoing card's dwell had been read, and every exit was dropped.
const VIEW_AFTER_MS = 1000;

function cardOpened(slide, c, i) {
  if (slide._seenAt) return;
  slide._seenAt = Date.now();
  clearTimeout(slide._seenTimer);
  slide._seenTimer = setTimeout(() => track('card_view', cardParams(c, i)), VIEW_AFTER_MS);
}
function cardClosed(slide, c, i, complete) {
  clearTimeout(slide._seenTimer);
  if (!slide._seenAt) return;
  const dwell = Date.now() - slide._seenAt;
  slide._seenAt = 0;
  if (dwell < VIEW_AFTER_MS) return;
  track(complete ? 'card_complete' : 'card_exit',
    { ...cardParams(c, i), card_dwell_ms: dwell });
}
// Autoplay requires muted, so the feed starts silent — but a presser clip is carried by
// what is said, and without a control nothing suggests there is audio at all.
let soundOn = false;
function applySound() {
  document.querySelectorAll('#feed video').forEach((v) => (v.muted = !soundOn));
  document.querySelectorAll('.rb.sound').forEach((b) => {
    b.setAttribute('aria-pressed', soundOn);
    b.innerHTML = (soundOn ? IC.sound : IC.muted) + `<span>${soundOn ? 'Sound' : 'Muted'}</span>`;
  });
}

/** Placeholder art when a source gives no poster — deterministic per id, on-brand. */
function generated(id) {
  let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `<div class="gen" style="background:
    radial-gradient(120% 90% at 30% 10%, hsl(${h} 55% 17%), transparent 60%),
    linear-gradient(160deg,#02202f,#021118 70%)"></div>`;
}

/** Text and link blocks, positioned as a percentage of the frame. */
function overlaysFor(c) {
  if (!c.overlays?.length) return '';
  return `<div class="ovl">${c.overlays.map((o) => {
    const cls = `ov ${o.style} ${o.size} c-${o.color}`;
    const pos = o.style === 'band'
      ? `top:${o.y}%;text-align:${o.align}`
      : `left:${o.x}%;top:${o.y}%;text-align:${o.align}`;
    return o.type === 'link' && o.url
      ? `<a class="${cls}" style="${pos}" href="${esc(safeUrl(o.url))}" target="_blank" rel="noopener">${esc(o.text)}</a>`
      : `<p class="${cls}" style="${pos}">${esc(o.text)}</p>`;
  }).join('')}</div>`;
}

/** The default bottom block — suppressed when the card carries its own overlays. */
function chromeFor(c) {
  const show = c.chrome === 'on' || (c.chrome !== 'off' && !(c.overlays?.length));
  if (!show) return '';
  return `<div class="bot">
      <h2>${esc(c.headline)}</h2>
      ${c.caption ? `<p>${esc(c.caption)}</p>` : ''}
      ${c.action && safeUrl(c.action.url) ? `<a class="cta" href="${esc(c.action.url)}" target="_blank" rel="noopener">${esc(c.action.label)}</a>` : ''}
    </div>`;
}

function mediaFor(c) {
  const m = c.media || {};
  const fit = c.fit === 'contain' ? ' class="contain"' : '';
  if (m.kind === 'image')
    return `<img${fit} src="${esc(safeUrl(m.url))}" alt="${esc(c.headline)}" loading="lazy">`;
  if (m.kind === 'cloudinary' || m.kind === 'file') {
    const src = m.kind === 'cloudinary' ? m.mp4 : m.url;
    // The generated ground sits behind every video, so a slow or failed source still reads
    // as a designed card rather than a black rectangle.
    // A playback-time clip has to seek before it shows anything right, and a seek needs
    // metadata — so that one case preloads rather than waiting on play() to start loading.
    return generated(c.id) + `<video${fit} src="${esc(safeUrl(src))}"
      poster="${esc(safeUrl(c.poster[0]))}" playsinline muted loop
      preload="${c.clip?.playback ? 'metadata' : 'none'}"></video>`;
  }
  if (m.kind === 'youtube') {
    // YouTube's terms require its own player, so this item gets a poster rather than ours.
    // The fallback chain is attached in JS below — interpolating URLs into an onerror
    // attribute made every poster a script sink.
    const p = c.poster.map(safeUrl).filter(Boolean);
    return p.length
      ? `<img src="${esc(p[0])}" alt="" loading="lazy" data-fallback="${esc(JSON.stringify(p.slice(1)))}">`
      : generated(c.id);
  }
  const poster = safeUrl(c.poster[0]);
  return poster
    ? `<img src="${esc(poster)}" alt="" loading="lazy" data-fallback="[]">`
    : generated(c.id);
}

function render() {
  const rows = active === 'all' ? DATA.clips : DATA.clips.filter((c) => c.collection === active);
  ROWS = rows;
  const feed = $('#feed');
  if (!rows.length) { feed.innerHTML = `<p class="msg">Nothing published yet.<br>
    Publish items in the studio and they appear here.</p>`; return; }
  const name = (k) => (DATA.collections.find((c) => c.key === k) || {}).name || k;

  feed.innerHTML = rows.map((c, i) => `<article class="slide" data-id="${esc(c.id)}"
    data-hold="${c.advance?.seconds || 6}" data-advance="${c.advance?.mode || 'auto'}"
    data-index="${i}" data-total="${rows.length}" role="article"
    ${c.clip?.playback ? `data-in="${c.clip.start}" data-out="${c.clip.end}"` : ''}
    aria-posinset="${i + 1}" aria-setsize="${rows.length}"
    aria-label="${esc(c.headline)}">
    ${mediaFor(c)}<div class="st"></div>${
      (c.chrome === 'on' || (c.chrome !== 'off' && !(c.overlays?.length))) ? '<div class="sb"></div>' : ''
    }${overlaysFor(c)}

    <div class="top">
      <span class="coll${c.sponsor ? ' sp' : ''}">${esc(c.sponsor
        ? [c.sponsor.label, c.sponsor.name].filter(Boolean).join(' ')
        : name(c.collection))}</span>
      ${c.duration ? `<span class="dur">${esc(c.duration)}</span>` : ''}
    </div>
    ${chromeFor(c)}
    <p class="flash" hidden></p>
    <div class="rail">
      <button class="rb like" aria-pressed="${!!liked[c.id]}" aria-label="Like">${IC.like}<span>Like</span></button>
      <button class="rb share" aria-label="Share">${IC.share}<span>Share</span></button>
      <button class="rb sound" aria-pressed="${soundOn}"
        aria-label="${soundOn ? 'Mute' : 'Unmute'}">${soundOn ? IC.sound : IC.muted}<span>${
        soundOn ? 'Sound' : 'Muted'}</span></button>
      ${safeUrl(Object.values(c.links || {})[0])
        ? `<a class="rb" href="${esc(Object.values(c.links)[0])}" target="_blank" rel="noopener"
             aria-label="Open original">${IC.out}<span>Source</span></a>` : ''}
    </div></article>`).join('');

  feed.querySelectorAll('img[data-fallback]').forEach((img) => {
    let queue;
    try { queue = JSON.parse(img.dataset.fallback); } catch { queue = []; }
    img.onerror = () => {
      const next = queue.shift();
      if (next) img.src = next; else { img.onerror = null; img.remove(); }
    };
  });

  feed.querySelectorAll('.slide').forEach((s) => {
    const id = s.dataset.id;
    const at = Number(s.dataset.index) || 0;
    const card = rows[at];
    s.querySelector('.like').onclick = (e) => {
      const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on); liked[id] = on; likes.write(liked);
      track(on ? 'card_like' : 'card_unlike', cardParams(card, at));
    };
    s.querySelector('.sound').onclick = () => {
      soundOn = !soundOn; applySound();
      track('sound_toggle', { ...cardParams(card, at), sound_on: soundOn });
    };
    s.querySelector('.cta')?.addEventListener('click', () =>
      track('card_action', { ...cardParams(card, at), action_label: card.action?.label || '' }));
    s.querySelectorAll('.ovl a').forEach((a) => a.addEventListener('click', () =>
      track('overlay_link', { ...cardParams(card, at), link_text: a.textContent.slice(0, 60) })));
    s.querySelector('.rail a')?.addEventListener('click', () =>
      track('card_source_open', cardParams(card, at)));
    s.querySelector('.share').onclick = async () => {
      const c = rows.find((x) => x.id === id);
      const url = c.action?.url || Object.values(c.links || {})[0] || location.href;
      const say = (m) => {
        const el = s.querySelector('.flash');
        el.textContent = m; el.hidden = false;
        clearTimeout(el._t); el._t = setTimeout(() => (el.hidden = true), 2200);
      };
      if (navigator.share) {
        try {
          await navigator.share({ title: c.headline, url });
          track('card_share', { ...cardParams(c, at), share_method: 'native' });
          return;
        } catch { /* dismissed */ }
      }
      // writeText rejects on an insecure origin or without permission, and silently doing
      // nothing reads as a broken button.
      try {
        await navigator.clipboard.writeText(url);
        say('Link copied');
        track('card_share', { ...cardParams(c, at), share_method: 'clipboard' });
      } catch {
        say(url);
        track('card_share', { ...cardParams(c, at), share_method: 'fallback' });
      }
    };
  });
  activeIdx = 0; paintSegs(rows.length);
  io.disconnect();
  feed.querySelectorAll('.slide').forEach((s, j) => {
    if (j > 1) s.setAttribute('inert', '');
    io.observe(s);
  });
}

let activeIdx = 0;
const MAX_SEGS = 8;

/** One strip, redrawn on change — a per-slide strip was quadratic in the clip count. */
function paintSegs(total) {
  const segs = $('#segs');
  const show = Math.min(total, MAX_SEGS);
  const start = Math.max(0, Math.min(activeIdx - (show >> 1), total - show));
  segs.innerHTML = Array.from({ length: show }, (_, k) => {
    const idx = start + k;
    if (idx === activeIdx) return '<i class="on cur"><b class="fill"></b></i>';
    return `<i class="${idx < activeIdx ? 'on' : ''}"></i>`;
  }).join('');
  $('#pos').textContent = total > MAX_SEGS ? `${activeIdx + 1}/${total}` : '';
}
/** Static cards behave like a story: hold, fill the segment, advance. Video just plays. */
/** The card each slide renders, for event params. Set once per render. */
let ROWS = [];
const cardOf = (slide) => ROWS[Number(slide.dataset.index) || 0];

const io = new IntersectionObserver((es) => es.forEach((e) => {
  const slide = e.target;
  const v = slide.querySelector('video');
  const idxOf = Number(slide.dataset.index) || 0;

  if (e.isIntersecting) {
    const idx = idxOf;
    // Outside the index check: the first card is index 0 and activeIdx starts at 0, so
    // gating this on a change meant the opening card of every session went unrecorded.
    // cardOpened is idempotent per slide, so calling it on re-entry costs nothing.
    if (cardOf(slide)) cardOpened(slide, cardOf(slide), idx);
    if (idx !== activeIdx) {
      activeIdx = idx;
      paintSegs(Number(slide.dataset.total) || 1);
      // Keep the off-screen cards out of the tab order — otherwise a keyboard user walks
      // every card's Like/Share before reaching the next one.
      $('#feed').querySelectorAll('.slide').forEach((s2, j) => {
        const near = Math.abs(j - activeIdx) <= 1;
        if (near) s2.removeAttribute('inert'); else s2.setAttribute('inert', '');
      });
    }
  }
  const fill = $('#segs .fill');

  if (!e.isIntersecting) {
    // Completion is recorded where it happens — the video's out-point, or the static
    // card's hold timer. Anything else leaving the screen is an exit.
    if (cardOf(slide)) cardClosed(slide, cardOf(slide), idxOf, slide._done === true);
    slide._done = false;
    v?.pause();
    if (fill) { fill.style.transition = 'none'; fill.style.width = '0%'; }
    if (slide._t) { clearTimeout(slide._t); slide._t = null; }
    return;
  }
  const auto = slide.dataset.advance !== 'manual'
    && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const next = () => {
    slide._done = true;
    const feed = $('#feed');
    if (slide.nextElementSibling) feed.scrollBy({ top: feed.clientHeight, behavior: 'smooth' });
    // On the last card nothing scrolls, so the completion would never be flushed.
    else if (cardOf(slide)) cardClosed(slide, cardOf(slide), idxOf, true);
  };

  if (v) {
    // A clip cut at playback time carries in/out rather than a trimmed file, so the player
    // enforces the range: seek in, stop at out. Lets a plain uploaded file be clipped with
    // no transformation service involved.
    const inAt = Number(slide.dataset.in);
    const outAt = Number(slide.dataset.out);
    const ranged = Number.isFinite(inAt) && Number.isFinite(outAt);

    v.loop = !auto && !ranged;
    v.onended = auto ? next : null;
    if (ranged) {
      // Chromium drops a currentTime assignment made at readyState 0, and preload="none"
      // means nothing is loaded when the observer first fires — so seek now for the case
      // where metadata is already there, and again the moment it arrives. The bounds check
      // is two-sided so a clip left paused on its out-point restarts on the way back.
      const seek = () => {
        if (!(v.currentTime >= inAt && v.currentTime < outAt)) v.currentTime = inAt;
      };
      v.onloadedmetadata = seek;
      seek();
      v.ontimeupdate = () => {
        if (v.currentTime < outAt) return;
        if (auto) { v.pause(); next(); } else { v.currentTime = inAt; }
      };
    } else {
      v.ontimeupdate = null;
      v.currentTime = 0;
    }
    v.play().catch(() => {});
    if (fill) { fill.style.transition = 'none'; fill.style.width = '0%'; }
    return;
  }
  if (!fill) return;

  // Filling the bar under reduced motion made all 20 cards look already-seen.
  if (!auto) { fill.style.transition = 'none'; fill.style.width = '0%'; return; }

  const hold = Number(slide.dataset.hold) || 6;
  fill.style.transition = 'none'; fill.style.width = '0%';
  requestAnimationFrame(() => {
    fill.style.transition = `width ${hold}s linear`;
    fill.style.width = '100%';
  });
  slide._t = setTimeout(next, hold * 1000);
}), { threshold: 0.6 });

function chips() {
  const all = [{ key: 'all', name: 'All' }, ...DATA.collections];
  $('#bar').innerHTML = all.map((c) =>
    `<button class="chip" aria-pressed="${c.key === active}" data-k="${esc(c.key)}">${esc(c.name)}</button>`).join('');
  $('#bar').querySelectorAll('.chip').forEach((b) => (b.onclick = () => {
    active = b.dataset.k; chips(); render(); $('#feed').scrollTop = 0;
    track('collection_filter', { feed_cards: ROWS.length });
  }));
}

const step = (dir) => $('#feed').scrollBy({ top: dir * $('#feed').clientHeight, behavior: 'smooth' });
$('#next').onclick = () => step(1);
$('#prev').onclick = () => step(-1);

$('#feed').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  $('#feed').scrollBy({ top: (e.key === 'ArrowDown' ? 1 : -1) * $('#feed').clientHeight,
    behavior: 'smooth' });
});

try {
  DATA = await (await fetch('/api/feed')).json();
  loadGA(resolveGA());
  chips(); render(); applySound();
  track('feed_load', { feed_cards: ROWS.length, feed_collections: DATA.collections.length });
  // A tab switch or a close ends the session without the observer ever firing again.
  addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden') return;
    const slide = $('#feed').querySelector(`.slide[data-index="${activeIdx}"]`);
    if (slide && cardOf(slide)) cardClosed(slide, cardOf(slide), activeIdx, slide._done === true);
  });
} catch (e) {
  $('#feed').innerHTML = `<p class="msg">Couldn't load the feed.<br>${esc(e.message)}</p>`;
}
</script></body></html>
