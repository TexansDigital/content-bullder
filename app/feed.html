  };
}

function render() {
  const rows = withSystemCards(active === 'all' ? DATA.clips : DATA.clips.filter((c) => c.collection === active));
  const feed = $('#feed');
  // Replacing innerHTML detaches the slides but leaves their timers armed. An orphaned hold
  // timer then fired next(), found no sibling, and flushed a completion — which cardOf()
  // resolved against the NEW rows at the old index, so one card's view produced two
  // completions, the second attributed to whatever now sat in that position.
  io.disconnect();
  if (player.slide) closePlayer(false);
  feed.querySelectorAll('.slide').forEach((s) => {
    clearTimeout(s._t); clearTimeout(s._seenTimer);
    s._t = null; s._seenAt = 0; s._done = false;
    const v = s.querySelector('video');
    if (v) { v.ontimeupdate = null; v.onended = null; v.onloadedmetadata = null; v.pause(); }
  });
  ROWS = rows;
  if (!rows.length) { feed.innerHTML = `<p class="msg">Nothing published yet.<br>
    Publish items in the studio and they appear here.</p>`; return; }
  const name = (k) => (DATA.collections.find((c) => c.key === k) || {}).name || k;

  feed.innerHTML = rows.map((c, i) => c.system ? systemMarkup(c, i, rows.length) : `<article class="slide${c.media?.kind === 'youtube' ? ' yt' : ''}" data-id="${esc(c.id)}"
    data-hold="${c.advance?.seconds || 6}" data-advance="${c.advance?.mode || 'auto'}"
    data-index="${i}" data-total="${rows.length}" role="article"
    ${c.clip?.playback ? `data-in="${esc(c.clip.start)}" data-out="${esc(c.clip.end)}"` : ''}
    aria-posinset="${i + 1}" aria-setsize="${rows.length}"
    aria-label="${esc(c.headline)}">
    ${mediaFor(c)}<div class="st"></div>${
      // The scrim is not decoration for the default headline — the like/share/sound rail
      // sits on it. Suppressing it on composed cards put those controls on bare video at
      // 2.5:1, and composed cards are the ones most likely to be bright. Always render it;
      // a card carrying its own blocks gets the shorter version, enough for the rail
      // without dimming the composition.
      (c.chrome === 'on' || (c.chrome !== 'off' && !(c.overlays?.length)))
        ? '<div class="sb"></div>' : '<div class="sb rail"></div>'
    }${overlaysFor(c)}

    <div class="top">
      <span class="coll${c.sponsor ? ' sp' : ''}">${esc(c.sponsor
        ? [c.sponsor.label, c.sponsor.name].filter(Boolean).join(' ')
        : name(c.collection))}</span>
      ${c.duration ? `<span class="dur">${esc(c.duration)}</span>` : ''}
    </div>
    ${chromeFor(c)}
    ${c.media?.kind === 'youtube' && /^[A-Za-z0-9_-]{6,20}$/.test(c.media.videoId || '')
      ? `<button class="play" type="button" aria-label="Play: ${esc(c.headline)}">${IC.play}</button>
         <div class="band"><b>${whyFor(c)}${esc(c.headline)}</b>
           <button class="rb like" aria-pressed="${!!liked[c.id]}" aria-label="Like">${IC.like}<span>Like</span></button>
           <button class="rb share" aria-label="Share">${IC.share}<span>Share</span></button>
           <button class="rb sound" aria-pressed="${soundOn}" aria-label="${soundOn ? 'Mute' : 'Unmute'}">${soundOn ? IC.sound : IC.muted}<span>${soundOn ? 'Sound' : 'Muted'}</span></button>
           <button class="rb expand" aria-label="Expand player">${IC.expand}<span>Full</span></button>
           ${safeUrl(c.links?.youtube) ? `<a class="rb" href="${esc(c.links.youtube)}" target="_blank" rel="noopener" aria-label="Watch on YouTube">${IC.out}<span>Source</span></a>` : ''}
         </div>` : ''}
    <p class="flash" hidden></p>
    ${c.media?.kind === 'youtube' ? '' : `<div class="rail">
      <button class="rb like" aria-pressed="${!!liked[c.id]}" aria-label="Like">${IC.like}<span>Like</span></button>
      <button class="rb share" aria-label="Share">${IC.share}<span>Share</span></button>
      ${c.media?.kind === 'youtube' ? '' : `<button class="rb sound" aria-pressed="${soundOn}"
        aria-label="${soundOn ? 'Mute' : 'Unmute'}">${soundOn ? IC.sound : IC.muted}<span>${
        soundOn ? 'Sound' : 'Muted'}</span></button>`}
      ${safeUrl(Object.values(c.links || {})[0])
        ? `<a class="rb" href="${esc(Object.values(c.links)[0])}" target="_blank" rel="noopener"
             aria-label="Open original">${IC.out}<span>Source</span></a>` : ''}
    </div>`}</article>`).join('');

  feed.querySelectorAll('img[data-fallback]').forEach((img) => {
    let queue;
    try { queue = JSON.parse(img.dataset.fallback); } catch { queue = []; }
    img.onerror = () => {
      const next = queue.shift();
      if (next) img.src = next; else { img.onerror = null; img.remove(); }
    };
  });

  feed.querySelectorAll('.slide').forEach((s) => {
    const id = s.dataset.id;
    const at = Number(s.dataset.index) || 0;
    const card = rows[at];
    if (card?.system) { wireSystem(s, card, at); return; }
    s.querySelector('.like').onclick = (e) => {
      const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on); liked[id] = on; likes.write(liked);
      track(on ? 'card_like' : 'card_unlike', cardParams(card, at));
      if (on) likeLift(card, Number(s.dataset.index) || at);
    };
    const snd = s.querySelector('.sound');
    if (snd) snd.onclick = () => {
      soundOn = !soundOn; applySound();
      track('sound_toggle', { ...cardParams(card, at), sound_on: soundOn });
    };
    const play = s.querySelector('.play');
    if (play) {
      play.onclick = () => openPlayer(s, card, at);
      const ex = s.querySelector('.expand');
      if (ex) ex.onclick = () => openPlayer(s, card, at);
      // The whole poster is the target too; the button is the affordance.
      const img = s.querySelector(':scope > img');
      if (img) { img.dataset.play = '1'; img.onclick = () => openPlayer(s, card, at); }
    }
    s.querySelector('.cta')?.addEventListener('click', () =>
      track('card_action', { ...cardParams(card, at), action_label: card.action?.label || '' }));
    s.querySelectorAll('.ovl a').forEach((a) => a.addEventListener('click', () =>
      track('overlay_link', { ...cardParams(card, at), link_text: a.textContent.slice(0, 60) })));
    s.querySelector('.rail a')?.addEventListener('click', () =>
      track('card_source_open', cardParams(card, at)));
    s.querySelector('.share').onclick = async () => {
      const c = rows.find((x) => x.id === id);
      const url = c.action?.url || Object.values(c.links || {})[0] || location.href;
      const say = (m) => {
        const el = s.querySelector('.flash');
        el.textContent = m; el.hidden = false;
        clearTimeout(el._t); el._t = setTimeout(() => (el.hidden = true), 2200);
      };
      if (navigator.share) {
        try {
          await navigator.share({ title: c.headline, url });
          track('card_share', { ...cardParams(c, at), share_method: 'native' });
          return;
        } catch { /* dismissed */ }
      }
      // writeText rejects on an insecure origin or without permission, and silently doing
      // nothing reads as a broken button.
      try {
        await navigator.clipboard.writeText(url);
        say('Link copied');
        track('card_share', { ...cardParams(c, at), share_method: 'clipboard' });
      } catch {
        say(url);
        track('card_share', { ...cardParams(c, at), share_method: 'fallback' });
      }
    };
  });
  activeIdx = 0; paintSegs(rows.length);
  feed.querySelectorAll('.slide').forEach((s, j) => {
    if (j > 1) s.setAttribute('inert', '');
    io.observe(s);
  });
  if (PAGE.layout === 'rail') renderTiles(rows, name);
}

/* ---------- the rail --------------------------------------------------------
 * One tile per card, in the ranked order, with the reason on it. Tapping a tile opens the
 * feed at that card; the feed's own observer then records the view at that position, so a
 * rail session slices exactly like a feed session, plus rail_open and rail_close.
 */
function tileMarkup(c, i, name, prevWhy = '') {
  // The same poster chain the card uses: YouTube's largest size is often missing for a Short,
  // so the tile walks the list on error rather than showing a broken glyph.
  const posters = c.system ? [] : (c.media?.kind === 'image' ? [c.media.url] : (c.poster || [])).map(safeUrl).filter(Boolean);
  const poster = posters[0] || '';
  if (c.system) return systemTile(c, i);
  // The reason appears once per run: three Anderson tiles in a row say it on the first only.
  const why = prevWhy === (c.why?.label || '') ? '' : whyFor(c);
  const playable = c.media?.kind === 'youtube' || c.media?.kind === 'cloudinary' || c.media?.kind === 'file';
  return `<button class="tile" type="button" data-index="${i}" data-id="${esc(c.id)}" aria-label="${esc(c.headline)}">
    <div class="art">${poster ? `<img src="${esc(poster)}" alt="" loading="lazy" data-fallback="${esc(JSON.stringify(posters.slice(1)))}">` : ''}${generated(c.id)}
      <span class="tcoll">${esc(c.sponsor ? [c.sponsor.label, c.sponsor.name].filter(Boolean).join(' ') : name(c.collection))}</span>
      ${playable ? `<span class="tdur">${IC.play}${c.duration ? `<span>${esc(c.duration)}</span>` : ''}</span>` : ''}</div>
    <div class="tb">${why}<h3>${esc(c.headline)}</h3></div></button>`;
}

/** A system card as a tile: the flag plate, the stamp, the headline, one line, and a stat where there is one. */
function systemTile(c, i) {
  const x = c.extra || {};
  const face = c.system === 'picker' ? { stamp: DATA.prefs ? 'Your feed // edit' : 'Your feed // 3 taps', line: DATA.prefs ? 'Change anything. The feed moves on the spot.' : 'Pick players, lanes, how you watch.' }
    : c.system === 'week' ? { stamp: 'Your week', stat: String(x.views), line: `clips this week. ${weekSentence(x).replace(/\.$/, '')}` }
    : c.system === 'offer' ? { stamp: `Offer // until ${fmtDay(x.ends_at)}`, line: `${Number(x.cards) > 0 ? `${x.cards} clips ready. ` : ''}${x.blurb || 'One tap. Back to normal after.'}` }
    : c.system === 'expiry' ? { stamp: 'Your feed // update', line: 'Back to your picks.' }
    : { stamp: 'Enter // Houston Texans', line: x.blurb || '' };
  return `<button class="tile sys" type="button" data-index="${i}" data-id="${esc(c.id)}" aria-label="${esc(c.headline)}"><div class="tsb"></div>
    <div class="tb"><div class="stamp"><i></i><span>${esc(face.stamp)}</span></div>${face.stat ? `<b class="stat">${esc(face.stat)}</b>` : ''}<h3>${esc(c.headline)}</h3>${face.line ? `<p>${esc(face.line)}</p>` : ''}</div></button>`;
}

/** The strip shows this many tiles; the feed behind it still holds every card. */
const TILE_MAX = 40;
function renderTiles(rows, name) {
  const el = $('#tiles');
  closeRail(false);
  el.innerHTML = rows.slice(0, TILE_MAX).map((c, i) => tileMarkup(c, i, name, i > 0 && !rows[i - 1].system ? (rows[i - 1].why?.label || '') : '')).join('');
  el.querySelectorAll('.tile').forEach((t) => (t.onclick = () => openRail(Number(t.dataset.index) || 0)));
  el.querySelectorAll('img[data-fallback]').forEach((img) => {
    let queue;
    try { queue = JSON.parse(img.dataset.fallback); } catch { queue = []; }
    img.onerror = () => {
      const next = queue.shift();
      if (next) img.src = next; else { img.onerror = null; img.remove(); }   // the ground shows through
    };
  });
  el.scrollLeft = 0;
  previewTiles(rows);
}

/**
 * Rail: the lead tiles play a muted preview instead of a still, when the knob says so. The strip
 * is seen and scrolled past (first review, 2 Nov: 17 loads, 0 taps); a moving first tile is the
 * invitation. Never with save-data or reduced motion on, never for a system card, and the preview
 * takes no taps, so the tile still opens. One tile_preview event per tile shown this way.
 */
const PREVIEW_MAX = 3;
function previewTiles(rows) {
  const n = Math.max(0, Math.min(PREVIEW_MAX, Number(knobs.rail_preview) || 0));
  if (!n) return;
  try { if (navigator.connection?.saveData || matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch { /* no preference API: preview */ }
  let made = 0;
  for (let i = 0; i < rows.length && made < n && i < TILE_MAX; i++) {
    const c = rows[i];
    if (!c || c.system) continue;
    const art = $('#tiles').querySelector(`.tile[data-index="${i}"] .art`);
    if (!art || art.querySelector('.tprev')) continue;
    const m = c.media || {};
    let el = null;
    if (m.kind === 'file' || m.kind === 'cloudinary') {
      const src = safeUrl(m.kind === 'cloudinary' ? m.mp4 : m.url);
      if (!src) continue;
      el = document.createElement('video');
      el.src = src; el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true; el.preload = 'metadata';
      el.setAttribute('muted', ''); el.setAttribute('playsinline', ''); el.setAttribute('aria-hidden', 'true');
      // The still stays until frames actually move; a preview that never loads is just the poster.
      el.addEventListener('playing', () => el.classList.add('on'), { once: true });
    } else if (m.kind === 'youtube' && YT_ID.test(String(m.videoId || ''))) {
      el = document.createElement('iframe');
      const q = new URLSearchParams({ autoplay: '1', mute: '1', controls: '0', playsinline: '1', loop: '1', playlist: m.videoId,
        rel: '0', modestbranding: '1', iv_load_policy: '3', disablekb: '1', origin: location.origin });
      el.src = `https://www.youtube-nocookie.com/embed/${m.videoId}?${q}`;
      el.allow = 'autoplay; encrypted-media'; el.tabIndex = -1; el.title = ''; el.setAttribute('aria-hidden', 'true');
      // No playing event crosses the frame boundary: show it once loaded, when YouTube's own poster is up.
      el.addEventListener('load', () => setTimeout(() => el.classList.add('on'), 400), { once: true });
    } else continue;
    el.className = 'tprev';
    art.appendChild(el);
    made++;
    track('tile_preview', { ...cardParams(c, i), preview_kind: m.kind });
  }
}
/** The stage covers the strip: our own previews pause behind it and pick up again on close. */
function previewsPlaying(on) {
  document.querySelectorAll('#tiles video.tprev').forEach((v) => { if (on) v.play().catch(() => {}); else v.pause(); });
}

function openRail(i) {
  const stage = $('#stage'), feed = $('#feed');
  stage.classList.add('open');
  previewsPlaying(false);
  // Jump before the observer looks: reading clientHeight forces layout, so the first card
  // the observer sees intersecting is the one that was tapped, not card one.
  feed.scrollTop = i * feed.clientHeight;
  const card = ROWS[i];
  if (card) track('rail_open', cardParams(card, i));
  $('#rclose').focus({ preventScroll: true });
}

function closeRail(report = true) {
  const stage = $('#stage');
  if (!stage.classList.contains('open')) return;
  if (player.slide) closePlayer(false);
  const card = ROWS[activeIdx];
  stage.classList.remove('open');
  previewsPlaying(true);
  if (report && card) track('rail_close', cardParams(card, activeIdx));
  const t = $('#tiles').querySelector(`.tile[data-index="${activeIdx}"]`);
  if (t) { t.scrollIntoView({ inline: 'nearest', block: 'nearest' }); t.focus({ preventScroll: true }); }
}
$('#rclose').innerHTML = IC.close;
$('#rclose').onclick = () => closeRail();
addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#player').hidden && PAGE.layout === 'rail') closeRail(); });

let activeIdx = 0;
const MAX_SEGS = 8;

/** One strip, redrawn on change — a per-slide strip was quadratic in the clip count. */
function paintSegs(total) {
  const segs = $('#segs');
  const show = Math.min(total, MAX_SEGS);
  const start = Math.max(0, Math.min(activeIdx - (show >> 1), total - show));
  segs.innerHTML = Array.from({ length: show }, (_, k) => {
    const idx = start + k;
    if (idx === activeIdx) return '<i class="on cur"><b class="fill"></b></i>';
    return `<i class="${idx < activeIdx ? 'on' : ''}"></i>`;
  }).join('');
  $('#pos').textContent = total > MAX_SEGS ? `${activeIdx + 1}/${total}` : '';
  // One card, one full-width segment — chrome that carries no information.
  $('#segs').hidden = total < 2;
}
/** Static cards behave like a story: hold, fill the segment, advance. Video just plays. */
/** The card each slide renders, for event params. Set once per render. */
let ROWS = [];
const cardOf = (slide) => ROWS[Number(slide.dataset.index) || 0];

const io = new IntersectionObserver((es) => es.forEach((e) => {
  const slide = e.target;
  const v = slide.querySelector('video');
  const idxOf = Number(slide.dataset.index) || 0;

  if (e.isIntersecting) {
    const idx = idxOf;
    // Outside the index check: the first card is index 0 and activeIdx starts at 0, so
    // gating this on a change meant the opening card of every session went unrecorded.
    // cardOpened is idempotent per slide, so calling it on re-entry costs nothing.
    if (cardOf(slide)) cardOpened(slide, cardOf(slide), idx);
    if (idx !== activeIdx) {
      activeIdx = idx;
      paintSegs(Number(slide.dataset.total) || 1);
      // Keep the off-screen cards out of the tab order — otherwise a keyboard user walks
      // every card's Like/Share before reaching the next one.
      $('#feed').querySelectorAll('.slide').forEach((s2, j) => {
        const near = Math.abs(j - activeIdx) <= 1;
        if (near) s2.removeAttribute('inert'); else s2.setAttribute('inert', '');
      });
    }
  }
  const fill = $('#segs .fill');

  if (!e.isIntersecting) {
    // Completion is recorded where it happens — the video's out-point, or the static
    // card's hold timer. Anything else leaving the screen is an exit.
    if (cardOf(slide)) cardClosed(slide, cardOf(slide), idxOf, slide._done === true);
    slide._done = false;
    v?.pause();
    unmountYt(slide);
    if (fill) { fill.style.transition = 'none'; fill.style.width = '0%'; }
    if (slide._t) { clearTimeout(slide._t); slide._t = null; }
    return;
  }
  const auto = slide.dataset.advance !== 'manual' && !reducedMotion();
  const next = () => advanceFrom(slide);

  if (slide.classList.contains('yt')) {
    if (fill) { fill.style.transition = 'none'; fill.style.width = '0%'; }
    // Reduced motion: a poster and a play button, nothing moves on its own.
    if (reducedMotion()) return;
    if (!player.slide) mountYt(slide, cardOf(slide));
    return;
  }

  if (v) {
    // A clip cut at playback time carries in/out rather than a trimmed file, so the player
    // enforces the range: seek in, stop at out. Lets a plain uploaded file be clipped with
    // no transformation service involved.
    const inAt = Number(slide.dataset.in);
    const outAt = Number(slide.dataset.out);
    const ranged = Number.isFinite(inAt) && Number.isFinite(outAt);

    v.loop = !auto && !ranged;
    v.onended = auto ? next : null;
    if (ranged) {
      // Chromium drops a currentTime assignment made at readyState 0, and preload="none"
      // means nothing is loaded when the observer first fires — so seek now for the case
      // where metadata is already there, and again the moment it arrives. The bounds check
      // is two-sided so a clip left paused on its out-point restarts on the way back.
      const seek = () => {
        if (!(v.currentTime >= inAt && v.currentTime < outAt)) v.currentTime = inAt;
      };
      v.onloadedmetadata = seek;
      seek();
      v.ontimeupdate = () => {
        if (v.currentTime < outAt) return;
        if (auto) { v.pause(); next(); } else { v.currentTime = inAt; }
      };
    } else {
      v.ontimeupdate = null;
      v.currentTime = 0;
    }
    v.play().catch(() => {});
    if (fill) { fill.style.transition = 'none'; fill.style.width = '0%'; }
    return;
  }
  // Filling the bar under reduced motion made all 20 cards look already-seen.
  if (!auto) { if (fill) { fill.style.transition = 'none'; fill.style.width = '0%'; } return; }
  armHold(slide);
}), {
  // The scroll container is the root, not the top-level viewport. On houstontexans.com the feed
  // is an iframe, and when a phone showed less than 60% of that iframe the implicit root never
  // reported a card as intersecting: no view, no player, no story clock, a dead poster that a
  // visitor reloaded four times. Against the feed's own box a snapped card is always 100%.
  root: $('#feed'),
  threshold: 0.6,
});

function chips() {
  if (PAGE.collection && DATA.collections.some((c) => c.key === PAGE.collection)) {
    active = PAGE.collection; document.body.classList.add('locked'); $('#bar').innerHTML = ''; return;
  }
  const all = [{ key: 'all', name: 'All' }, ...DATA.collections];
  // A fan who has set their feed gets a way back to it: one chip, always first.
  const mine = DATA.prefs && DATA.picker ? `<button class="chip mine" data-k="__mine" aria-pressed="false">Your feed ✎</button>` : '';
  $('#bar').innerHTML = mine + all.map((c) =>
    `<button class="chip" aria-pressed="${c.key === active}" data-k="${esc(c.key)}">${esc(c.name)}</button>`).join('');
  $('#bar').querySelectorAll('.chip').forEach((b) => (b.onclick = () => {
    if (b.dataset.k === '__mine') {
      forcePicker = true; active = 'all'; chips(); render(); $('#feed').scrollTop = 0;
      track('prefs_open', { feed_cards: ROWS.length });
      return;
    }
    active = b.dataset.k; chips(); render(); $('#feed').scrollTop = 0;
    track('collection_filter', { feed_cards: ROWS.length });
  }));
}

const step = (dir) => $('#feed').scrollBy({ top: dir * $('#feed').clientHeight, behavior: 'smooth' });
$('#next').onclick = () => step(1);
$('#prev').onclick = () => step(-1);

$('#feed').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  $('#feed').scrollBy({ top: (e.key === 'ArrowDown' ? 1 : -1) * $('#feed').clientHeight,
    behavior: 'smooth' });
});

try {
  // The URL form wins and needs no handshake at all; otherwise announce and wait briefly.
  const fromUrl = new URLSearchParams(location.search).get('pid');
  if (ID_SHAPE.test(fromUrl || '')) setPocketId(fromUrl, 'url');
  else if (window.parent !== window) {
    emit('hello', {});
    setTimeout(() => { if (!identified) flush('device'); }, HANDSHAKE_MS);
  } else flush('device');

  // Ask for the feed as the person watching, so it can be ordered for them. The pocket id
  // when the host has answered, the device id when measuring without one, nothing when the
  // visitor declined. A slow host costs RANK_WAIT_MS at most, then the shared order is served.
  await identityOrWait(RANK_WAIT_MS);
  const who = pocketId ? `sid=${pocketId}` : (measuring && mintDevice()) ? `did=${deviceId}` : '';
  DATA = await (await fetch(feedUrl(who))).json();
  loadGA(resolveGA());
  knobs = { ...KNOB_DEFAULTS, ...(DATA.knobs || {}) };
  chips(); render(); applySound();
  track('feed_load', loadParams());
  welcome();
  // A tab switch or a close ends the session without the observer ever firing again.
  addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden') return;
    const slide = $('#feed').querySelector(`.slide[data-index="${activeIdx}"]`);
    if (slide && cardOf(slide)) cardClosed(slide, cardOf(slide), activeIdx, slide._done === true);
  });
  // Registered after the close handler above so the card_exit it emits is in this batch.
  addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') postOutbox(); });
  // Anything kept while /api/feed was in flight (identity, feed_load) goes now.
  if (outbox.length && !outboxTimer) outboxTimer = setTimeout(postOutbox, 500);
} catch (e) {
  // This renders on houstontexans.com. A CDN error page or a bad deploy used to surface
  // "DATA.collections is not iterable" to a fan, in grey on black, with no way out.
  $('#feed').innerHTML = `<p class="msg"><b>This feed isn't available right now.</b><br>
    Check back in a moment.<br>
    <button class="retry" type="button">Try again</button></p>`;
  $('#feed').querySelector('.retry').onclick = () => location.reload();
  console.error('feed load failed:', e);
}
</script>
<p class="toast" id="toast" role="status" hidden></p>
<div id="player" role="dialog" aria-modal="true" aria-label="Now playing" hidden>
  <div class="pbar"><b id="p-title"></b><button class="pclose" type="button" aria-label="Back to the feed"></button></div>
  <div class="pframe"></div>
</div>
</body></html>
