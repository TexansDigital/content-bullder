<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feed Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;700&display=swap">
<style>
:root{--steel:#021118;--s2:#0a1d27;--s3:#13303d;--red:#eb0028;--red2:#ff123a;--blue:#0080c6;
 --w:#fff;--body:rgba(255,255,255,.84);--mute:rgba(255,255,255,.52);--line:rgba(255,255,255,.14);
 --line2:rgba(255,255,255,.3);--ok:#1fae5a;--warn:#f5a623;
 --mono:"Azeret Mono",ui-monospace,Menlo,monospace;
 --sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--steel);color:var(--w);font:14px/1.5 var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

header{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;margin:0}
header h1 i{color:var(--red);font-style:normal}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
 border:1px solid var(--line2);padding:4px 8px;color:var(--mute)}
header .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill.dirty{border-color:var(--warn);color:var(--warn)}
.blocking{border-left:3px solid var(--red);background:rgba(235,0,40,.1);padding:8px 11px;
 font-size:12px;margin:0 0 10px;color:var(--w)}
.blocking b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
 text-transform:uppercase;color:var(--red);margin-bottom:4px}
.swatch{width:100%;height:26px;border:1px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--w);outline-offset:-4px;border-color:var(--w)}
.mini h5{grid-column:1/-1;font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--mute);margin:4px 0 0;font-weight:400}

.cols{display:grid;grid-template-columns:250px minmax(0,1fr) 392px;min-height:0}
.pane{min-height:0;overflow-y:auto;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.pane h2{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--mute);margin:0;padding:13px 16px 9px;position:sticky;top:0;background:var(--steel);
 border-bottom:1px solid var(--line);z-index:2}
.pad{padding:14px 16px}

label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
 text-transform:uppercase;color:var(--mute);margin:0 0 4px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);
 padding:8px 9px;border-radius:0;font-size:13px}
textarea{resize:vertical;min-height:58px;font-family:var(--mono);font-size:11.5px;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--w);
 outline-offset:1px}
.field{margin-bottom:11px}

button{background:var(--red);border:0;padding:9px 14px;cursor:pointer;font-weight:700;
 font-size:11px;letter-spacing:.07em;text-transform:uppercase}
button:hover{background:var(--red2)}button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.ghost{background:transparent;border:1px solid var(--line2)}
button.ghost:hover{background:transparent;border-color:var(--red)}
button.sm{padding:5px 9px;font-size:10px}
button:focus-visible{outline:2px solid var(--w);outline-offset:2px}
.row{display:flex;gap:7px;flex-wrap:wrap}

.card{display:grid;grid-template-columns:52px minmax(0,1fr);gap:11px;padding:10px 16px;
 border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.card:hover{background:rgba(255,255,255,.04)}
.card[aria-selected="true"]{background:rgba(235,0,40,.14);box-shadow:inset 3px 0 0 var(--red)}
.card .th{aspect-ratio:4/5;background:var(--s3);overflow:hidden;position:relative}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .th span{position:absolute;inset:auto 0 0;font-family:var(--mono);font-size:8px;
 text-align:center;background:rgba(2,17,24,.85);padding:1px}
.card h3{font-size:12.5px;line-height:1.3;margin:0 0 4px;font-weight:600}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
 padding:2px 5px;background:var(--s3);color:var(--body)}
.tag.src{background:var(--blue);color:#fff}
.tag.err{background:var(--red);color:#fff}
.tag.warn{background:var(--warn);color:#2a1a00}
.tag.ok{background:var(--ok);color:#00170a}
.empty{padding:30px 16px;color:var(--mute);font-size:13px;text-align:center}

.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--steel);z-index:3}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);
 padding:12px 6px;font-size:11px}
.tabs button[aria-selected="true"]{color:var(--w);border-bottom-color:var(--red)}
.tabs button:hover{color:var(--w);background:none}
.count{font-family:var(--mono);font-size:9px;opacity:.7;margin-left:4px}

@media(max-width:1100px){
  /* Stacked, the per-pane scrollers cut panels off mid-control with no visible scrollbar,
     so "Add to inbox" simply disappeared. Let the page be the only scroller. */
  .cols{grid-template-columns:1fr;overflow-y:auto}
  .pane{overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  .pane h2,.tabs{position:static}
}

.warnlist{margin:9px 0 0;padding:0;list-style:none}
.warnlist li{font-size:11.5px;color:var(--body);padding:4px 0 4px 13px;position:relative}
.warnlist li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;background:var(--warn)}
.warnlist li.e::before{background:var(--red)}
#drop{border:1px dashed var(--line2);min-height:104px;display:grid;place-items:center;
 text-align:center;cursor:pointer;margin-bottom:12px;padding:12px;position:relative;overflow:hidden;
 font-size:12px;color:var(--mute);line-height:1.5;transition:border-color .14s}
#drop:hover,#drop.over{border-color:var(--red);color:var(--w)}
#drop:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#drop b{color:var(--w)}
#drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#drop-clear{position:absolute;top:4px;right:4px;z-index:2;background:rgba(2,17,24,.85);
 border:1px solid var(--line2);width:24px;height:24px;padding:0;font-size:14px;line-height:1}
#drop-clear:hover{background:var(--red);border-color:var(--red)}
/* ---- clip: cutting a vertical moment out of a longer asset ---- */
.clip{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}
.clip h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--mute);margin:0 0 9px;font-weight:400}
.scrub{position:relative;height:42px;background:var(--s2);border:1px solid var(--line);
 margin-bottom:8px;touch-action:none;cursor:crosshair}
.scrub .sel{position:absolute;top:0;bottom:0;background:rgba(235,0,40,.28);
 border-left:2px solid var(--red);border-right:2px solid var(--red)}
.scrub .h{position:absolute;top:0;bottom:0;width:14px;margin-left:-7px;cursor:ew-resize;z-index:2}
.scrub .h::after{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--red)}
.scrub .h:focus-visible{outline:2px solid var(--w);outline-offset:1px}
.clip-times{display:grid;grid-template-columns:1fr 1fr 74px;gap:6px;margin-bottom:9px}
.clip-times label{font-size:8.5px}
.clip-frame{aspect-ratio:9/16;max-width:84px;background:#000;border:1px solid var(--line);
 overflow:hidden;flex:none}
.clip-frame img{width:100%;height:100%;object-fit:cover;display:block}
.clip-row{display:flex;gap:10px;align-items:flex-start}

/* ---- canvas: the 9:16 card being composed ---- */
/* Side by side, a canvas big enough to position on left the controls a sliver wide and
   their button grids wrapped to one per row. Stack instead: both get full width. */
.canvas-wrap{display:grid;gap:12px;margin-bottom:14px;justify-items:stretch}
.canvas{max-width:232px;width:100%;margin:0 auto}
.canvas{position:relative;aspect-ratio:9/16;background:#000;border:1px solid var(--line);
 overflow:hidden;container-type:inline-size;touch-action:none;user-select:none}
.canvas-ctl{display:grid;gap:9px}
.canvas-ctl .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* These are toggles. Left on the default red fill, every one looked active and the pressed
   state was invisible. */
.canvas-ctl .row2 button{background:var(--s2);border:1px solid var(--line);font-size:10px;
 letter-spacing:.05em;padding:8px 4px}
.canvas-ctl .row2 button:hover{background:var(--s3);border-color:var(--line2)}
.canvas-ctl .row2 button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.canvas-ctl .row2 button[data-add]{background:var(--red);border-color:var(--red)}
.canvas-ctl .row2 button[data-add]:hover{background:var(--red2)}
.canvas>img,.canvas>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.canvas.contain>img,.canvas.contain>video{object-fit:contain}
.canvas .ghost{position:absolute;inset:0;background:
 radial-gradient(120% 90% at 30% 10%,#123,transparent 60%),linear-gradient(160deg,#02202f,#021118)}
.ov{position:absolute;transform:translate(-50%,-50%);max-width:88%;font-weight:900;
 text-transform:uppercase;line-height:.98;margin:0;cursor:grab;padding:2px 3px;
 outline:1px dashed transparent;white-space:pre-wrap;overflow-wrap:break-word;hyphens:none}
.ov.band{left:0!important;transform:translateY(-50%);width:100%;max-width:100%;padding:7px 9px}
.ov.box{padding:6px 9px}
.ov:hover{outline-color:rgba(255,255,255,.5)}
.ov[data-sel="1"]{outline:2px solid var(--red);outline-offset:1px;cursor:grabbing}
.ov.sm{font-size:clamp(6px,3.2cqw,11px)}.ov.md{font-size:clamp(8px,4.4cqw,14px)}
.ov.lg{font-size:clamp(10px,6.2cqw,19px)}.ov.xl{font-size:clamp(12px,8.6cqw,26px)}
.ov.c-white{color:#fff;text-shadow:0 1px 6px rgba(2,17,24,.8)}
.ov.c-red{color:var(--red);text-shadow:0 1px 6px rgba(2,17,24,.8)}
.ov.c-steel{color:var(--steel)}
.ov.c-blue{color:var(--blue);text-shadow:0 1px 6px rgba(2,17,24,.8)}
.ov.band.c-white,.ov.box.c-white{background:#fff;color:var(--steel);text-shadow:none}
.ov.band.c-red,.ov.box.c-red{background:var(--red);color:#fff;text-shadow:none}
.ov.band.c-steel,.ov.box.c-steel{background:var(--steel);color:#fff;text-shadow:none}
.ov.band.c-blue,.ov.box.c-blue{background:var(--blue);color:#fff;text-shadow:none}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:5px;margin-bottom:9px}
.mini button{padding:6px 3px;font-size:9.5px;letter-spacing:.05em;background:var(--s2);
 border:1px solid var(--line);font-weight:700}
.mini button:hover{background:var(--s3);border-color:var(--line2)}
.mini button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.mini button[data-custom] span{opacity:.5;padding-left:3px;font-weight:400}
.mini button[data-custom] span:hover{opacity:1;color:var(--red)}
.mini button[data-custom]{border-style:dashed}
.sect{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}
.sect>h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--mute);margin:0 0 9px;font-weight:400}
.hint{font-size:11px;color:var(--mute);line-height:1.5;margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--s3);
 border:1px solid var(--line2);padding:10px 16px;font-size:13px;z-index:50;
 transition:opacity .2s,transform .2s}
#toast[hidden]{display:none}
a{color:var(--blue)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
</style></head><body>
<div class="app">
<header>
  <h1>Feed Studio <i>//</i> Texans</h1>
  <span class="pill" id="store-state">loading</span>
  <div class="sp">
    <a class="pill" href="/feed" target="_blank" rel="noopener">Preview feed ↗</a>
    <a class="pill" href="/api/feed" target="_blank" rel="noopener">API ↗</a>
  </div>
</header>

<div class="cols">
  <!-- ── sources ── -->
  <section class="pane">
    <h2>Sources</h2>
    <div class="pad">
      <div class="field">
        <label for="adapter">Adapter</label>
        <select id="adapter"></select>
      </div>
      <p class="mono" id="adapter-note" style="margin:-4px 0 12px;letter-spacing:.04em;
         text-transform:none;font-size:11px;line-height:1.5"></p>
      <div id="adapter-fields"></div>
      <button id="pull" style="width:100%">Pull</button>
      <p id="pull-out" style="font-size:12px;color:var(--mute);margin:10px 0 0"></p>
      <hr>
      <h3 class="mono" style="margin:0 0 10px">Make a card</h3>
      <div id="drop" tabindex="0" role="button"
           aria-label="Choose a graphic or video to upload">
        <span id="drop-label">Drop a graphic or video<br><b>or click to choose</b></span>
        <img id="drop-prev" alt="" hidden>
        <button id="drop-clear" type="button" aria-label="Clear the chosen file" hidden>×</button>
      </div>
      <input id="file" type="file" accept="image/*,video/mp4,video/webm" hidden>
      <div class="field"><label for="n-url">…or paste an image / video URL</label>
        <input id="n-url" placeholder="https://static.clubs.nfl.com/…"></div>
      <div class="field"><label for="n-h">Headline</label><input id="n-h" placeholder="Girls flag signups are open"></div>
      <div class="field"><label for="n-col">Collection</label><select id="n-col"></select></div>
      <div class="row" style="margin-bottom:11px">
        <div class="field" style="flex:1;margin:0"><label for="n-al">Button</label>
          <input id="n-al" placeholder="Register a team"></div>
        <div class="field" style="flex:1;margin:0"><label for="n-hold">Hold (s)</label>
          <input id="n-hold" type="number" value="6" min="2" max="20"></div>
      </div>
      <div class="field"><label for="n-au">Link</label><input id="n-au" placeholder="https://…"></div>
      <button id="n-add" class="ghost" style="width:100%">Add to inbox</button>
      <p id="n-out" style="font-size:12px;color:var(--mute);margin:9px 0 0"></p>
      <hr>
      <p class="mono" style="letter-spacing:.04em;text-transform:none;font-size:11.5px;line-height:1.6">
        Every source normalizes to the same item. A graphic with a link is a card exactly like
        a clip is &mdash; the feed never learns where anything came from.
      </p>
    </div>
  </section>

  <!-- ── queue ── -->
  <section class="pane">
    <div class="tabs" role="tablist">
      <button role="tab" data-status="inbox" aria-selected="true">Inbox<span class="count" id="c-inbox"></span></button>
      <button role="tab" data-status="published" aria-selected="false">Published<span class="count" id="c-published"></span></button>
      <button role="tab" data-status="archived" aria-selected="false">Archived<span class="count" id="c-archived"></span></button>
    </div>
    <div id="list" role="listbox" aria-label="Content queue" tabindex="-1"></div>
  </section>

  <!-- ── editor ── -->
  <section class="pane">
    <h2>Item</h2>
    <div id="editor"><p class="empty">Select an item.</p></div>
  </section>
</div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script type="module">
const $ = (s) => document.querySelector(s);
const api = async (path, opts) => {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
};
let STATE = { items: [], collections: [], counts: {} };
let status = 'inbox', selected = null, dirty = false;

/**
 * Edits live in a local draft until Save, so anything that re-renders the editor from
 * server state silently throws them away. Track it, show it, and ask before discarding.
 */
function markDirty(on = true) {
  dirty = on;
  const pill = $('#store-state');
  if (!pill) return;
  pill.classList.toggle('dirty', dirty);
  if (dirty) pill.textContent = 'Unsaved changes';
  else pill.textContent = STATE.updatedAt
    ? `Saved ${new Date(STATE.updatedAt).toLocaleTimeString()}` : 'Empty';
}
/** Returns false if the user chose to keep editing. */
function confirmDiscard(what = 'this card') {
  if (!dirty) return true;
  return confirm(`You have unsaved changes to ${what}. Discard them?`);
}
window.addEventListener('beforeunload', (e) => {
  if (!dirty) return;
  e.preventDefault(); e.returnValue = '';
});

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(t._t); t._t = setTimeout(() => (t.hidden = true), 2600);
}

/** Collections are keys, not labels — typing "Pressers" produced an invalid item. */
const collectionOptions = (cur) => {
  const known = (STATE.collections || []).map((c) =>
    `<option value="${esc(c.key)}"${c.key === cur ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  // Never show a value the item does not have: an unmatched stored key would otherwise
  // silently display as the first option and be saved as that.
  const orphan = cur && !(STATE.collections || []).some((c) => c.key === cur)
    ? `<option value="${esc(cur)}" selected>${esc(cur)} — not a valid collection</option>` : '';
  return orphan + known;
};

let renderAdapterFields = () => {};

/* ---------- sources ---------- */
async function initAdapters() {
  const { adapters } = await api('/api/adapters');
  const sel = $('#adapter');
  // Upload has no pull step, so it is a poor default — its big red Pull button can only
  // ever report success for doing nothing.
  const order = ['manual', 'youtube', 'cloudinary', 'rss', 'upload'];
  adapters.sort((x, y) => order.indexOf(x.key) - order.indexOf(y.key));
  sel.innerHTML = adapters.map((a) => `<option value="${a.key}">${a.label}</option>`).join('');
  const render = () => {
    const a = adapters.find((x) => x.key === sel.value);
    $('#adapter-note').textContent = a.notes || '';
    $('#pull').hidden = a.key === 'upload';
    // Known defaults, so the only thing anyone has to supply is a key.
    const DEFAULTS = { channelId: 'UCa_FcpOBe8G6VAR18RYS-aA',
                       baseUrl: 'https://static.clubs.nfl.com' };
    const extra = { youtube: [['max', 'Max videos', '100']],
                    cloudinary: [['assets', 'Delivery URLs or public IDs, one per line', '', 'textarea'],
                                 ['baseUrl', 'Delivery origin', DEFAULTS.baseUrl]],
                    rss: [['collection', 'Collection', '', 'collection']],
                    manual: [['urls', 'One URL per line', '', 'textarea'],
                             ['collection', 'Collection', '', 'collection']],
                    upload: [] }[a.key] || [];
    // `extra` carries the label and the control type, so it must win over the bare field
    // derived from `needs` — otherwise a multi-line field renders as a single-line input
    // and silently drops every line but the first.
    const byName = new Map(a.needs.map((n) => [n, [n, n, DEFAULTS[n] || '']]));
    for (const f of extra) byName.set(f[0], f);
    $('#adapter-fields').innerHTML = [...byName.values()]
      .map(([name, label, val, kind]) => `
        <div class="field"><label for="f-${name}">${label}</label>
        ${kind === 'textarea'
          ? `<textarea id="f-${name}" name="${name}" placeholder="one per line"></textarea>`
          : kind === 'collection'
          ? `<select id="f-${name}" name="${name}">${collectionOptions()}</select>`
          : `<input id="f-${name}" name="${name}" value="${val}"
               ${/key|secret|token/i.test(name) ? 'type="password" autocomplete="off"' : ''}>`}
        </div>`).join('');
  };
  sel.onchange = render;
  // Collections arrive with the first refresh, so keep a handle and re-render once they do.
  renderAdapterFields = render;
  render();

  $('#pull').onclick = async () => {
    if (sel.value === 'upload') {
      $('#pull-out').textContent = 'Upload is not a pull source — use “Make a card” below.';
      $('#drop').focus();
      return;
    }
    if (!confirmDiscard()) return;
    const btn = $('#pull'); btn.disabled = true; btn.textContent = 'Pulling…';
    const config = {};
    $('#adapter-fields').querySelectorAll('[name]').forEach((el) => {
      if (el.value.trim()) config[el.name] = el.value.trim();
    });
    try {
      const r = await api('/api/pull', { method: 'POST',
        body: JSON.stringify({ adapter: sel.value, config }) });
      $('#pull-out').textContent = r.added
        ? `${r.added} new${r.skipped ? `, ${r.skipped} already here` : ''}.`
        : `Nothing new — ${r.skipped || 0} already in the queue.`;
      markDirty(false); await refresh();
      toast(r.added ? `Pulled ${r.added} new item${r.added > 1 ? 's' : ''}` : 'Nothing new');
    } catch (e) {
      $('#pull-out').innerHTML = `<span style="color:var(--red)">${e.message}</span>`;
    } finally { btn.disabled = false; btn.textContent = 'Pull'; }
  };
}

/* ---------- list ---------- */
function renderList() {
  const rows = STATE.items.filter((i) => i.status === status);
  const el = $('#list');
  if (!rows.length) {
    const other = Object.entries(STATE.counts || {})
      .filter(([k, n]) => k !== status && n).map(([k, n]) => `${n} ${k}`).join(' · ');
    el.innerHTML = `<p class="empty">${
      status === 'inbox' ? 'Inbox is clear.' : `Nothing ${status}.`}${
      other ? `<br><span class="mono" style="font-size:10px">${esc(other)}</span>` : ''}${
      status === 'inbox' && !other ? '<br>Pull from a source to start.' : ''}</p>`;
    return;
  }
  el.innerHTML = rows.map((i) => {
    const v = i.validation || { ok: true, errors: [], warnings: [] };
    const badges = [
      `<span class="tag src">${esc(i.source)}</span>`,
      `<span class="tag">${esc(i.collection)}</span>`,
      i.duration ? `<span class="tag">${esc(i.duration)}</span>` : '',
      i.flags.vertical ? '' : '<span class="tag warn">not vertical</span>',
      i.flags.duplicate ? '<span class="tag warn">dupe</span>' : '',
      v.errors.length ? `<span class="tag err">${v.errors.length} blocking</span>`
        : v.warnings.length
          ? `<span class="tag warn" title="${esc(v.warnings.join('; '))}">${v.warnings.length} note${
              v.warnings.length > 1 ? 's' : ''}</span>`
        : '<span class="tag ok">ready</span>',
    ].filter(Boolean).join('');
    return `<article class="card" data-id="${esc(i.id)}" tabindex="0" role="option"
      aria-selected="${selected === i.id}"
      aria-label="${esc(i.headline)} — ${esc(i.collection)}${v.errors.length ? ', has blocking issues' : ''}">
      <div class="th">${i.poster[0]
        ? `<img src="${esc(safeUrl(i.poster[0]))}" alt="" loading="lazy" onerror="this.remove()">`
        : `<span>no art</span>`}</div>
      <div><h3>${esc(i.headline)}</h3><div class="meta">${badges}</div></div>
    </article>`;
  }).join('');
  const choose = (c) => {
    if (c.dataset.id === selected) return;
    if (!confirmDiscard()) return;
    markDirty(false);
    selected = c.dataset.id;
    renderList(); renderEditor();
    // Landing mid-form on the previous item's scroll offset hides the canvas entirely.
    $('#editor').parentElement.scrollTop = 0;
  };
  el.querySelectorAll('.card').forEach((c) => {
    c.onclick = () => choose(c);
    c.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(c); return; }
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      const all = [...el.querySelectorAll('.card')];
      const next = all[all.indexOf(c) + (e.key === 'ArrowDown' ? 1 : -1)];
      next?.focus();
    };
  });
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Escaping alone doesn't stop `javascript:` reaching an href or src. */
const safeUrl = (u) => (/^(https?:|\/|data:image\/)/i.test(String(u || '').trim()) ? u : '');

/* ---------- editor ---------- */
function renderEditor() {
  const i = STATE.items.find((x) => x.id === selected);
  const el = $('#editor');
  if (!i || i.id !== renderEditor._last) { selOv = null; renderEditor._last = i?.id; }
  if (!i) { el.innerHTML = '<p class="empty">Select an item.</p>'; return; }
  const v = i.validation || { ok: true, errors: [], warnings: [] };
  el.innerHTML = `<div class="pad">
    <div class="canvas-wrap">
      <div class="canvas${i.fit === 'contain' ? ' contain' : ''}" id="cv">${canvasMedia(i)}</div>
      <div class="canvas-ctl">
        <div class="row2">
          <button data-add="text">+ Text</button>
          <button data-add="link">+ Link</button>
        </div>
        <div>
          <h5 style="font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;
            text-transform:uppercase;color:var(--mute);margin:0 0 5px;font-weight:400">Graphic</h5>
          <div class="row2">
            <button data-fit="cover" aria-pressed="${i.fit !== 'contain'}">Fill</button>
            <button data-fit="contain" aria-pressed="${i.fit === 'contain'}">Letterbox</button>
          </div>
        </div>
        <p class="hint" style="margin:0">Letterbox leaves room above and below the graphic for text.</p>
        <div class="sect" style="margin-top:2px;padding-top:11px">
          <h4>Default headline block</h4>
          <div class="mini">
            <button data-chrome="auto" aria-pressed="${i.chrome !== 'on' && i.chrome !== 'off'}">Auto</button>
            <button data-chrome="on" aria-pressed="${i.chrome === 'on'}">Show</button>
            <button data-chrome="off" aria-pressed="${i.chrome === 'off'}">Hide</button>
          </div>
          <p class="hint">Auto hides it once the card has its own text blocks.</p>
        </div>
        <div class="sect" style="margin-top:2px;padding-top:11px">
          <h4>Advance</h4>
          <div class="row2">
            <button data-adv="auto" aria-pressed="${i.advance.mode !== 'manual'}">Auto</button>
            <button data-adv="manual" aria-pressed="${i.advance.mode === 'manual'}">Swipe</button>
          </div>
          <div class="field" id="adv-secs" style="margin-top:9px"
            ${i.advance.mode === 'manual' ? 'hidden' : ''}>
            <label for="e-sec">Hold (seconds)</label>
            <input id="e-sec" type="number" min="2" max="60" value="${i.advance.seconds}">
          </div>
        </div>
      </div>
    </div>

    ${clipPanel(i)}

    <div class="sect" style="margin-top:0;border-top:0;padding-top:0">
      <h4>Layout</h4>
      <div class="mini" id="tpl"></div>
      <p class="hint" id="tpl-note">Applying a layout replaces this card's blocks and pacing.
        The media stays.</p>
      <div class="row" style="margin-top:9px">
        <input id="tpl-name" placeholder="Name this layout" style="flex:1;min-width:0">
        <button class="ghost sm" id="tpl-save">Save as layout</button>
      </div>
    </div>

    <div id="ov-panel"></div>

    <div class="field"><label for="e-h">Headline</label>
      <input id="e-h" value="${esc(i.headline)}"></div>
    <div class="field"><label for="e-c">Collection</label>
      <select id="e-c">${collectionOptions(i.collection)}</select></div>
    <div class="field"><label for="e-cap">Caption</label>
      <input id="e-cap" value="${esc(i.caption || '')}"></div>
    <div class="row" style="margin-bottom:11px">
      <div class="field" style="flex:1;margin:0"><label for="e-al">Action label</label>
        <input id="e-al" value="${esc(i.action?.label || '')}"></div>
      <div class="field" style="flex:2;margin:0"><label for="e-au">Action URL</label>
        <input id="e-au" value="${esc(i.action?.url || '')}"></div>
    </div>
    <div class="field"><label for="e-sp">Sponsor (blank for none)</label>
      <input id="e-sp" value="${esc(i.sponsor?.name || '')}"></div>
    <div class="field"><label for="e-si">Sort index</label>
      <input id="e-si" type="number" value="${i.sortIndex}"></div>

    ${v.errors.length ? `<p class="blocking"><b>Can't publish yet</b>${
      v.errors.map((e) => esc(e)).join('<br>')}</p>` : ''}
    ${v.warnings.length ? `<ul class="warnlist" aria-label="Worth checking">
      ${v.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}

    <hr>
    <div class="row">
      <button id="e-save">Save</button>
      ${i.status !== 'published'
        ? `<button id="e-pub" class="ghost"${v.ok ? '' : ' aria-disabled="true"'}>Publish</button>`
        : `<button id="e-unpub" class="ghost">Unpublish</button>`}
      ${i.status === 'archived'
        ? `<button id="e-inbox" class="ghost">Move to inbox</button>
           <button id="e-del" class="ghost">Delete</button>`
        : `<button id="e-arch" class="ghost">Archive</button>`}
    </div>
    <hr>
    <p class="mono" style="letter-spacing:.04em;text-transform:none;font-size:11px;line-height:1.7">

      source ${esc(i.source)} · ${esc(i.media.kind)}${i.clip
        ? ` · clip ${i.clip.start}–${i.clip.end}s` : ''}<br>
      ${Object.entries(i.links).filter(([, u]) => safeUrl(u)).map(([k, u]) =>
        `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(k)} ↗</a>`).join(' · ') || ''}
    </p></div>`;

  // The draft carries the whole item so a redraw still has media and poster to paint,
  // but its overlays and advance are copies — nothing is written until Save.
  const draft = { ...i, overlays: JSON.parse(JSON.stringify(i.overlays || [])),
                  advance: { ...i.advance } };
  const syncDraft = () => markDirty();
  currentDraft = () => ({ overlays: draft.overlays, fit: draft.fit,
                          chrome: draft.chrome, advance: draft.advance });
  renderTemplates(i); wireClip(i);
  renderOverlayPanel(draft); wireCanvas(draft, syncDraft); wirePanel(draft, syncDraft);

  const changes = () => ({
    overlays: draft.overlays, fit: draft.fit, advance: draft.advance, chrome: draft.chrome,
    headline: $('#e-h').value, collection: $('#e-c').value,
    caption: $('#e-cap').value || null,
    action: $('#e-au').value ? { label: $('#e-al').value || 'Watch', url: $('#e-au').value } : null,
    sponsor: $('#e-sp').value ? { name: $('#e-sp').value, label: 'Presented by' } : null,
    sortIndex: Number($('#e-si').value) || 0,
  });
  const patch = async (extra, msg) => {
    await api('/api/items', { method: 'PATCH',
      body: JSON.stringify({ id: i.id, changes: { ...changes(), ...extra } }) });
    await refresh(); toast(msg);
  };
  el.querySelectorAll('input,select,textarea').forEach((f) =>
    f.addEventListener('input', () => markDirty()));
  $('#e-save').onclick = () => patch({}, 'Saved');
  $('#e-pub')?.addEventListener('click', () => patch({ status: 'published' }, 'Published'));
  $('#e-unpub')?.addEventListener('click', () => patch({ status: 'inbox' }, 'Moved to inbox'));
  $('#e-arch').onclick = () => patch({ status: 'archived' }, 'Archived');
}

/* ---------- clipping ---------- */
const hhmmss = (n) => {
  const t = Math.max(0, Math.round(n));
  return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
};

/**
 * A long asset is not a card — it is the thing cards get cut out of. Only Cloudinary can be
 * clipped, because the trim is expressed in the delivery URL and YouTube never returns the
 * file at all.
 */
function clipPanel(i) {
  if (i.media?.kind !== 'cloudinary') {
    return i.durationSeconds > 180
      ? `<div class="clip"><h4>Clipping</h4><p class="hint">This is
         ${esc(i.duration)} long, but ${esc(i.source)} media can't be trimmed — only
         Cloudinary assets can. Upload the master to Cloudinary to cut clips from it.</p></div>`
      : '';
  }
  const total = i.clip ? (i.clip.end - i.clip.start) : (i.durationSeconds || 600);
  const a = 0, bb = Math.min(20, Math.max(4, Math.round(total * 0.05)));
  return `<div class="clip">
    <h4>Cut a clip${i.clip ? ' from this clip' : ''}</h4>
    <div class="scrub" id="scrub" role="group" aria-label="Clip range">
      <div class="sel" id="c-sel"></div>
      <div class="h" id="c-in"  tabindex="0" role="slider" aria-label="Clip start"></div>
      <div class="h" id="c-out" tabindex="0" role="slider" aria-label="Clip end"></div>
    </div>
    <div class="clip-row">
      <div style="flex:1;min-width:0">
        <div class="clip-times">
          <div><label for="c-s">In</label><input id="c-s" type="number" min="0" step="1" value="${a}"></div>
          <div><label for="c-e">Out</label><input id="c-e" type="number" min="1" step="1" value="${bb}"></div>
          <div><label>Length</label><input id="c-len" value="${hhmmss(bb - a)}" readonly tabindex="-1"></div>
        </div>
        <div class="field"><label for="c-h">Clip headline</label>
          <input id="c-h" placeholder="The line that makes the clip"></div>
        <button class="ghost sm" id="c-make">Create clip</button>
        <p class="hint" id="c-out-msg" style="margin-top:7px">Makes a new card. This asset stays whole.</p>
      </div>
      <div class="clip-frame"><img id="c-frame" alt="" onerror="this.style.opacity=.15"></div>
    </div>
  </div>`;
}

function wireClip(i) {
  const scrub = $('#scrub'); if (!scrub) return;
  const total = i.clip ? (i.clip.end - i.clip.start) : (i.durationSeconds || 600);
  let inS = Number($('#c-s').value) || 0, outS = Number($('#c-e').value) || 10;
  const base = (i.media.mp4 || '').split('/video/upload/')[0];
  const pid = i.clip?.of || i.media.publicId;

  const paint = () => {
    const pi = (inS / total) * 100, po = (outS / total) * 100;
    $('#c-sel').style.left = pi + '%';
    $('#c-sel').style.width = Math.max(0.5, po - pi) + '%';
    $('#c-in').style.left = pi + '%';
    $('#c-out').style.left = po + '%';
    if (document.activeElement !== $('#c-s')) $('#c-s').value = Math.round(inS);
    if (document.activeElement !== $('#c-e')) $('#c-e').value = Math.round(outS);
    $('#c-len').value = hhmmss(outS - inS);
    const len = outS - inS;
    $('#c-out-msg').textContent = len > 180
      ? `${hhmmss(len)} — long for a feed. Most clips land under a minute.`
      : 'Makes a new card. This asset stays whole.';
    // A real frame from the asset, so the in-point is chosen by eye rather than by number.
    if (base && pid) $('#c-frame').src =
      `${base}/video/upload/so_${Math.round(inS + (outS - inS) / 3)},`
      + `f_auto,q_auto,c_fill,g_auto,ar_9:16,w_200/${pid}.jpg`;
  };

  const drag = (el, set) => {
    el.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); el.setPointerCapture(ev.pointerId);
      const move = (e) => {
        const r = scrub.getBoundingClientRect();
        set(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * total);
        paint();
      };
      const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
    });
    el.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 10 : 1;
      if (e.key === 'ArrowLeft') { set((el.id === 'c-in' ? inS : outS) - step); paint(); e.preventDefault(); }
      if (e.key === 'ArrowRight') { set((el.id === 'c-in' ? inS : outS) + step); paint(); e.preventDefault(); }
    });
  };
  drag($('#c-in'), (v) => { inS = Math.max(0, Math.min(v, outS - 1)); });
  drag($('#c-out'), (v) => { outS = Math.min(total, Math.max(v, inS + 1)); });
  // Typing the in-point first used to clamp it to the current out-point, so entering
  // 124 then 146 silently produced 9-146. Push the other end along instead.
  $('#c-s').oninput = () => {
    inS = Math.max(0, Math.min(Number($('#c-s').value) || 0, total - 1));
    if (outS <= inS) outS = Math.min(total, inS + 1);
    paint();
  };
  $('#c-e').oninput = () => {
    outS = Math.min(total, Math.max(Number($('#c-e').value) || 1, 1));
    if (inS >= outS) inS = Math.max(0, outS - 1);
    paint();
  };

  $('#c-make').onclick = async () => {
    try {
      const r = await api('/api/clip', { method: 'POST', body: JSON.stringify({
        id: i.id, start: inS, end: outS, headline: $('#c-h').value.trim() || undefined }) });
      $('#c-h').value = '';
      // Land on the new clip: the next thing anyone does is caption it or publish it.
      selected = r.created; markDirty(false); await refresh();
      $('#editor').parentElement.scrollTop = 0;
      toast(`Clip created — ${hhmmss(r.seconds)}`);
    } catch (e) { toast(e.message); }
  };
  paint();
}

/* ---------- canvas ---------- */
let selOv = null, TEMPLATES = [], currentDraft = null;

async function loadTemplates() {
  try { TEMPLATES = (await api('/api/templates')).templates; } catch { TEMPLATES = []; }
}

function renderTemplates(item) {
  const el = $('#tpl'); if (!el) return;
  el.innerHTML = TEMPLATES.map((t) =>
    `<button data-tpl="${t.key}" title="${esc(t.note)}"${t.custom ? ' data-custom="1"' : ''}
      >${esc(t.name)}${t.custom ? ' <span aria-hidden="true">×</span>' : ''}</button>`).join('');

  el.querySelectorAll('[data-tpl]').forEach((b) => {
    const baseNote = "Applying a layout replaces this card's blocks and pacing. The media stays.";
    b.onmouseenter = b.onfocus = () => {
      const t = TEMPLATES.find((x) => x.key === b.dataset.tpl);
      $('#tpl-note').textContent = t ? t.note : baseNote;
    };
    // Without this the one sentence warning about a destructive action disappears the first
    // time the cursor crosses the chips.
    b.onmouseleave = b.onblur = () => { $('#tpl-note').textContent = baseNote; };
    b.onclick = async (ev) => {
      // The × on a saved layout removes it; anywhere else applies it.
      if (ev.target.tagName !== 'SPAN'
          && !confirmDiscard('this card (applying a layout replaces its blocks)')) return;
      if (b.dataset.custom && ev.target.tagName === 'SPAN') {
        if (!confirm(`Delete the layout "${b.textContent.replace(/\s*×$/, '')}"?`)) return;
        await api('/api/templates', { method: 'DELETE',
          body: JSON.stringify({ key: b.dataset.tpl }) });
        await loadTemplates(); renderTemplates(item); toast('Layout deleted');
        return;
      }
      await api('/api/apply-template', { method: 'POST',
        body: JSON.stringify({ id: item.id, template: b.dataset.tpl }) });
      selOv = null; markDirty(false); await refresh();
      toast(`Applied ${b.textContent.replace(/\s*×$/, '')}`);
    };
  });

  $('#tpl-save').onclick = async () => {
    const name = $('#tpl-name').value.trim();
    if (!name) { $('#tpl-name').focus(); return toast('Name the layout first'); }
    try {
      // Send the live draft, or an unsaved block is dropped while the toast says "Saved".
      await api('/api/templates', { method: 'POST',
        body: JSON.stringify({ id: item.id, name, draft: currentDraft?.() }) });
      $('#tpl-name').value = '';
      await loadTemplates(); renderTemplates(item); toast(`Saved "${name}"`);
    } catch (e) { toast(e.message); }
  };
}

function canvasMedia(i) {
  const m = i.media || {};
  const src = m.kind === 'image' || m.kind === 'file' ? m.url
            : m.kind === 'cloudinary' ? m.mp4 : i.poster[0];
  const base = /\.(mp4|webm|m3u8)(\?|$)/i.test(src || '')
    ? `<video src="${esc(safeUrl(src))}" muted playsinline preload="metadata"></video>`
    : src ? `<img src="${esc(safeUrl(src))}" alt="" onerror="this.remove()">` : '<div class="ghost"></div>';
  return `<div class="ghost"></div>${base}${(i.overlays || []).map((o) => {
    const pos = o.style === 'band' ? `top:${o.y}%;text-align:${o.align}`
                                   : `left:${o.x}%;top:${o.y}%;text-align:${o.align}`;
    const tag = o.type === 'link' ? 'span' : 'p';
    return `<${tag} class="ov ${o.style} ${o.size} c-${o.color}" style="${pos}"
      data-ov="${o.id}" data-sel="${selOv === o.id ? 1 : 0}" tabindex="0" role="button"
      aria-label="${o.type === 'link' ? 'Link' : 'Text'} block: ${esc(o.text || 'empty')}">${
      esc(o.text || (o.type === 'link' ? 'Link text' : 'Text'))
    }</${tag}>`;
  }).join('')}`;
}

function renderOverlayPanel(i) {
  const panel = $('#ov-panel');
  const o = (i.overlays || []).find((x) => x.id === selOv);
  if (!o) {
    panel.innerHTML = (i.overlays || []).length
      ? `<p class="hint" style="margin:0 0 12px">Click a block on the card to edit it.</p>` : '';
    return;
  }
  const opts = (label, name, vals, cur, labels = {}) =>
    `<h5>${label}</h5>` + vals.map((v) =>
      `<button data-set="${name}" data-val="${v}" aria-pressed="${v === cur}">${
        esc(labels[v] || v)}</button>`).join('');
  // The pressed state is a red fill, so on the colour row red meant "selected" and the blue
  // swatch turned red when chosen. Render each option in its own colour instead.
  const SWATCH = { white: '#fff', red: 'var(--red)', steel: 'var(--steel)', blue: 'var(--blue)' };
  const colours = `<h5>Colour</h5>` + Object.entries(SWATCH).map(([k, css]) =>
    `<button class="swatch" data-set="color" data-val="${k}" aria-pressed="${k === o.color}"
       aria-label="${k}" title="${k}" style="background:${css}"></button>`).join('');
  panel.innerHTML = `<div class="sect" style="margin-top:0;border-top:0;padding-top:0">
    <h4>${o.type === 'link' ? 'Link block' : 'Text block'}</h4>
    <div class="field"><label for="o-t">Text</label>
      <input id="o-t" value="${esc(o.text)}"></div>
    ${o.type === 'link' ? `<div class="field"><label for="o-u">URL</label>
      <input id="o-u" value="${esc(o.url || '')}" placeholder="https://…"></div>` : ''}
    <div class="mini">${opts('Size', 'size', ['sm', 'md', 'lg', 'xl'], o.size)}</div>
    <div class="mini">${opts('Background', 'style', ['plain', 'band', 'box'], o.style,
      { plain: 'none', band: 'full band', box: 'pill' })}</div>
    <div class="mini">${colours}</div>
    <div class="mini">${opts('Align', 'align', ['left', 'center', 'right'], o.align)}</div>
    <div class="row"><button class="ghost sm" id="o-del">Remove block</button></div>
    <p class="hint">${o.style === 'band'
      ? 'Bands span the full width — only vertical position applies.'
      : 'Drag it on the card, or use the arrow keys (Shift for bigger steps).'}</p>
  </div>`;
}

/** Overlays are edited live in memory, then written with the rest of the item on Save. */
function wireCanvas(i, syncDraft) {
  const cv = $('#cv');

  cv.querySelectorAll('.ov').forEach((el) => {
    const select = () => {
      selOv = el.dataset.ov;
      cv.querySelectorAll('.ov').forEach((x) => (x.dataset.sel = x === el ? 1 : 0));
      renderOverlayPanel(i); wirePanel(i, syncDraft);
    };
    el.addEventListener('focus', select);
    // Dragging is pointer-only, so without this a keyboard user can neither reach a block
    // nor move one.
    el.addEventListener('keydown', (ev) => {
      const o = i.overlays.find((x) => x.id === el.dataset.ov);
      if (!o) return;
      if (ev.key === 'Escape') { el.blur(); selOv = null; renderOverlayPanel(i); return; }
      const step = ev.shiftKey ? 10 : 1;
      const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0],
                      ArrowUp: [0, -step], ArrowDown: [0, step] };
      const d = moves[ev.key];
      if (!d) return;
      ev.preventDefault();
      if (o.style !== 'band') o.x = Math.max(0, Math.min(100, o.x + d[0]));
      o.y = Math.max(0, Math.min(100, o.y + d[1]));
      if (o.style !== 'band') el.style.left = o.x + '%';
      el.style.top = o.y + '%';
      syncDraft();
    });
    el.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      select();
      const o = i.overlays.find((x) => x.id === selOv);
      if (!o) return;
      el.setPointerCapture(ev.pointerId);
      const move = (e) => {
        const r = cv.getBoundingClientRect();
        o.x = Math.round(Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)));
        o.y = Math.round(Math.min(100, Math.max(0, ((e.clientY - r.top) / r.height) * 100)));
        if (o.style !== 'band') el.style.left = o.x + '%';
        el.style.top = o.y + '%';
        syncDraft();
      };
      const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
    });
  });

  document.querySelectorAll('[data-add]').forEach((b) => (b.onclick = () => {
    const type = b.dataset.add;
    const o = { id: `ov-${Math.random().toString(36).slice(2, 8)}`, type,
      text: type === 'link' ? 'Register a team' : 'Headline', url: type === 'link' ? '' : null,
      // Stacking every new block at one spot made all but the topmost invisible.
      x: 50, y: Math.min(86, 42 + i.overlays.length * 9), align: 'center',
      size: type === 'link' ? 'md' : 'lg', style: type === 'link' ? 'box' : 'plain',
      color: type === 'link' ? 'red' : 'white' };
    i.overlays.push(o); selOv = o.id; redraw(i, syncDraft); syncDraft();
  }));
  document.querySelectorAll('[data-fit]').forEach((b) => (b.onclick = () => {
    i.fit = b.dataset.fit;
    document.querySelectorAll('[data-fit]').forEach((x) =>
      x.setAttribute('aria-pressed', x === b));
    cv.classList.toggle('contain', i.fit === 'contain'); syncDraft();
  }));
  document.querySelectorAll('[data-chrome]').forEach((b) => (b.onclick = () => {
    i.chrome = b.dataset.chrome;
    document.querySelectorAll('[data-chrome]').forEach((x) =>
      x.setAttribute('aria-pressed', x === b));
    syncDraft();
  }));
  document.querySelectorAll('[data-adv]').forEach((b) => (b.onclick = () => {
    i.advance.mode = b.dataset.adv;
    document.querySelectorAll('[data-adv]').forEach((x) =>
      x.setAttribute('aria-pressed', x === b));
    $('#adv-secs').hidden = i.advance.mode === 'manual'; syncDraft();
  }));
  $('#e-sec')?.addEventListener('input', (e) => {
    i.advance.seconds = Number(e.target.value) || 6; syncDraft();
  });
}

function wirePanel(i, syncDraft) {
  const o = i.overlays.find((x) => x.id === selOv);
  if (!o) return;
  $('#o-t')?.addEventListener('input', (e) => { o.text = e.target.value; redraw(i, syncDraft); });
  $('#o-u')?.addEventListener('input', (e) => { o.url = e.target.value; syncDraft(); });
  document.querySelectorAll('[data-set]').forEach((b) => (b.onclick = () => {
    o[b.dataset.set] = b.dataset.val; redraw(i, syncDraft);
  }));
  $('#o-del').onclick = () => {
    i.overlays = i.overlays.filter((x) => x.id !== selOv);
    selOv = null; redraw(i, syncDraft);
  };
}

function redraw(i, syncDraft) {
  const cv = $('#cv');
  const focus = document.activeElement?.id;
  const caret = document.activeElement?.selectionStart;
  cv.innerHTML = canvasMedia(i);
  renderOverlayPanel(i);
  wireCanvas(i, syncDraft); wirePanel(i, syncDraft);
  if (focus && $('#' + focus)) {
    $('#' + focus).focus();
    if (caret != null && $('#' + focus).setSelectionRange) {
      try { $('#' + focus).setSelectionRange(caret, caret); } catch {}
    }
  }
  syncDraft();
}

/* ---------- compose ---------- */
let pending = null;   // { url, contentType, name }

function initCompose() {
  const drop = $('#drop'), file = $('#file');
  const open = () => file.click();
  drop.onclick = open;
  drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => {
    e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, () => drop.classList.remove('over')));
  drop.addEventListener('drop', (e) => { e.preventDefault(); take(e.dataTransfer.files[0]); });
  file.onchange = () => take(file.files[0]);

  const MAX_MB = 12;
  async function take(f) {
    if (!f) return;
    // Checked here because the server can only answer once the whole body has arrived, and
    // an oversized POST dies as a bare "Failed to fetch".
    if (f.size > MAX_MB * 1048576) {
      $('#drop-label').innerHTML =
        `<b>${esc(f.name)}</b><br>${(f.size / 1048576).toFixed(1)}MB — the limit is ${MAX_MB}MB.<br>`
        + 'Export smaller or trim it first.';
      $('#drop-label').hidden = false; $('#drop-prev').hidden = true;
      $('#n-out').textContent = '';
      return;
    }
    $('#n-out').textContent = `Uploading ${f.name}…`;
    const dataUrl = await new Promise((ok, no) => {
      const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no;
      r.readAsDataURL(f);
    });
    try {
      const r = await api('/api/upload', { method: 'POST',
        body: JSON.stringify({ filename: f.name, dataUrl }) });
      pending = { ...r, name: f.name };
      if (/^image\//.test(r.contentType)) {
        $('#drop-prev').src = r.url; $('#drop-prev').hidden = false; $('#drop-label').hidden = true;
      } else {
        $('#drop-label').innerHTML = `<b>${esc(f.name)}</b><br>video ready`;
      }
      $('#n-out').textContent = `${(r.bytes / 1024).toFixed(0)}KB uploaded.`;
      // The URL field is now ignored, so stop it looking like a live choice.
      $('#n-url').disabled = true;
      $('#n-url').placeholder = 'Using the uploaded file — clear it to paste a URL';
      $('#drop-clear').hidden = false;
      if (!$('#n-h').value) $('#n-h').value = f.name.replace(/\.[^.]*$/, '').replace(/[-_]+/g, ' ');
    } catch (e) {
      const msg = /failed to fetch/i.test(e.message)
        ? `Upload failed — the file may be too large. Max ${MAX_MB}MB.` : e.message;
      $('#n-out').innerHTML = `<span style="color:var(--red)">${esc(msg)}</span>`;
    }
  }

  const clearStaged = () => {
    pending = null;
    $('#drop-prev').hidden = true; $('#drop-label').hidden = false;
    $('#drop-label').innerHTML = 'Drop a graphic or video<br><b>or click to choose</b>';
    $('#drop-clear').hidden = true;
    $('#n-url').disabled = false; $('#n-url').placeholder = 'https://static.clubs.nfl.com/…';
    $('#n-out').textContent = '';
    $('#file').value = '';
  };
  $('#drop-clear').onclick = (e) => { e.stopPropagation(); clearStaged(); };

  $('#n-add').onclick = async () => {
    const pasted = $('#n-url').value.trim();
    if (!pending && !pasted)
      return ($('#n-out').textContent = 'Choose a file or paste a URL.');
    if (!$('#n-h').value.trim()) return ($('#n-out').textContent = 'Needs a headline.');
    const src = pending || {
      url: pasted,
      contentType: /\.(mp4|webm|mov)(\?|$)/i.test(pasted) ? 'video/mp4' : 'image/png',
    };
    try {
      await api('/api/pull', { method: 'POST', body: JSON.stringify({
        adapter: 'upload', config: { files: [{
          url: src.url, contentType: src.contentType,
          headline: $('#n-h').value.trim(), collection: $('#n-col').value,
          actionLabel: $('#n-al').value.trim() || undefined,
          actionUrl: $('#n-au').value.trim() || undefined,
          durationSeconds: Number($('#n-hold').value) || 6,
        }] } }) });
      clearStaged();
      ['#n-h', '#n-al', '#n-au', '#n-url'].forEach((s) => ($(s).value = ''));
      await refresh(); toast('Card added to inbox');
    } catch (e) {
      const msg = /failed to fetch/i.test(e.message)
        ? `Upload failed — the file may be too large. Max ${MAX_MB}MB.` : e.message;
      $('#n-out').innerHTML = `<span style="color:var(--red)">${esc(msg)}</span>`;
    }
  }
;
}

/* ---------- boot ---------- */
async function refresh() {
  STATE = await api('/api/items');
  for (const s of ['inbox', 'published', 'archived'])
    $(`#c-${s}`).textContent = STATE.counts[s] ? ` ${STATE.counts[s]}` : '';
  markDirty(false);
  renderAdapterFields();
  const nc = $('#n-col');
  if (nc && !nc.options.length)
    nc.innerHTML = STATE.collections.map((c) => `<option value="${c.key}">${c.name}</option>`).join('');
  renderList(); renderEditor();
}
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => {
  status = b.dataset.status;
  document.querySelectorAll('.tabs button').forEach((x) =>
    x.setAttribute('aria-selected', x === b));
  renderList();
}));
await initAdapters();
await loadTemplates();
await refresh();
initCompose();
</script></body></html>
