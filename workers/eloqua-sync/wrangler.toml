# txfeed-eloqua-sync: the feed's picks into an Eloqua custom data object (CDO). Workstream 2, docs/workstreams.md.
#
# Writes one Eloqua CDO record per recognised fan with saved picks (Adam, 4 Nov 2026: a CDO, daily, go).
# Its own Worker so a change here can never change what a fan sees in the feed.
name = "txfeed-eloqua-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Nightly at 09:05 UTC, after the feed's profile rollup (08:25) and prune (08:40).
[triggers]
crons = ["5 9 * * *"]

[vars]
SUPABASE_URL = "https://xisvulbabqsyxnlyuwcz.supabase.co"
# Go, from Adam on 4 Nov 2026. The pass still writes nothing until the CDO below exists with
# the field for each live signal, and the secrets are set.
WRITE_ENABLED = "1"
# The Eloqua custom data object the picks land in, found by this name; its fields are found by
# name too (Contact ID, Favorite Player, Updated At, later Players, Lanes, Going, Watch, Format,
# Last Feed Visit). One record per contact, linked to the contact.
ELOQUA_CDO_NAME = "Feed Preferences"
# Which signals are written. Smallest version first: the favourite player alone. The others are
# planned and logged as dry every night, so widening is this one line.
ELOQUA_CDO_SIGNALS = "favorite_player"
# How far back a recognised session counts and how many contacts one run touches at most.
LOOKBACK_DAYS = "90"
RUN_MAX = "200"

# Secrets (set once with `npx wrangler secret put <NAME>` from this directory, never commit):
#   SUPABASE_SERVICE_KEY   reads feed_eloqua_candidates() and writes feed_eloqua_writes.
#   ELOQUA_SITE, ELOQUA_USER, ELOQUA_PASSWORD   the same three the feed Worker holds; a Worker
#                          cannot read another Worker's secrets, so they are set again here.
#   SYNC_KEY               the key GET /dry-run, GET /cdo and POST /run ask for (x-sync-key).
