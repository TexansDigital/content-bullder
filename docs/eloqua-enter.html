  function isDarkBackground(el) {
    var current = el;
    while (current && current !== document) {
      var style = window.getComputedStyle(current);
      var bgColor = style.backgroundColor;
      if (bgColor && bgColor !== 'rgba(0, 0, 0, 0)' && bgColor !== 'transparent') {
        var match = bgColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        if (match) {
          var brightness = (parseInt(match[1]) * 299 + parseInt(match[2]) * 587 + parseInt(match[3]) * 114) / 1000;
          return brightness < 128;

      }
      current = current.parentNode;
    }
    return false;
  }
  function overwriteCheckboxLabel(form, checkbox, newText, addRequired) {
    if (!checkbox) return;
    var label = form.querySelector('label[for="' + checkbox.id + '"]')
             || checkbox.parentNode.querySelector('label')
             || checkbox.nextElementSibling;
    if (label && label.tagName === 'LABEL') {

        var v = this.value.replace(/\D/g, '').substring(0, 8);

      agreementEl.classList.add(colorClass);

    }
    if (countryField) {
      var onCountryChange = function () {
        var val = countryField.value;
        var isUS = (val === 'US');

        if (birthdayField && birthdayRow) {
          if (isUS) {
            birthdayRow.classList.remove('htx-birthday-hidden');

        }

              var m = today.getMonth() - bday.getMonth();

          if (!intlAgeCheckbox.checked) { showFieldError(intlAgeCheckbox, 'You must confirm you are at least 18 years of age'); hasErrors = true; }

        if (!countryField && intlAgeCheckbox) {
          if (!intlAgeCheckbox.checked) { showFieldError(intlAgeCheckbox, 'You must confirm you are at least 18 years of age'); hasErrors = true; }
        }
        if (hasErrors) {
          var firstErr = form.querySelector('.htx-custom-error');
          if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
          if (e && e.preventDefault) e.preventDefault();
          return false;
        }
      } catch (err) {
