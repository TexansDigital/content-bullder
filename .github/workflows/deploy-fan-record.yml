# Deploy the fan-record Worker (workers/fan-record): the nightly D1 and Eloqua load behind
# fan_records. Tests run on every push and pull request that touches it; it deploys only from
# main, so the claude/fan-record branch can never change production by itself.
#
# Uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets as deploy-feed.
# Its own Worker secrets (SUPABASE_SERVICE_KEY, RUN_KEY, ELOQUA_*) are set once with
# `npx wrangler secret put` and survive every deploy.

name: deploy-fan-record

on:
  push:
    branches: [main, claude/fan-record]
    paths:
      - "workers/fan-record/**"
      - "workers/feed/src/eloqua.js"
      - "test/verify-fan-record.mjs"
      - ".github/workflows/deploy-fan-record.yml"
  pull_request:
    paths:
      - "workers/fan-record/**"
      - "test/verify-fan-record.mjs"
  workflow_dispatch:

concurrency:
  group: deploy-fan-record-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/verify-fan-record.mjs
      - run: node test/verify-eloqua.mjs
      - name: Bundle without deploying
        working-directory: workers/fan-record
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy fan-record
        working-directory: workers/fan-record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
