# Deploy the Eloqua writeback Worker (workers/eloqua-sync, Cloudflare name "txfeed-eloqua-sync")
# when its source or the shared ranking helpers change. Its own Action, its own Worker: a change
# here can never change what a fan sees in the feed.
#
# Uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets as deploy-feed.
# The Worker's own secrets (SUPABASE_SERVICE_KEY, ELOQUA_SITE, ELOQUA_USER, ELOQUA_PASSWORD,
# SYNC_KEY) are set once with `npx wrangler secret put` and survive every deploy.

name: deploy-eloqua-sync

on:
  push:
    branches: [main, claude/eloqua-writeback]
    paths:
      - "workers/eloqua-sync/**"
      - "workers/feed/src/eloqua.js"
      - "src/rank.js"
      - "test/verify-eloqua-sync.mjs"
      - ".github/workflows/deploy-eloqua-sync.yml"
  pull_request:
    paths:
      - "workers/eloqua-sync/**"
      - "workers/feed/src/eloqua.js"
      - "test/verify-eloqua-sync.mjs"
  workflow_dispatch:

concurrency:
  group: deploy-eloqua-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/verify-eloqua.mjs
      - run: node test/verify-eloqua-sync.mjs
      - run: node --check workers/eloqua-sync/src/sync.js
      - name: Bundle without deploying
        working-directory: workers/eloqua-sync
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy txfeed-eloqua-sync
        working-directory: workers/eloqua-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
